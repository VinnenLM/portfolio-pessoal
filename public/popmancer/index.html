<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Popmancer</title>
<style>
  html{background:#0b0f1a}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  #amb{position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;border-radius:0;background:#0b0f1a;pointer-events:none}
  #app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;--ctl:0px}
  #stage{position:relative;width:min(100vw,calc((100dvh - var(--ctl))*16/9));aspect-ratio:16/9}
  canvas{width:100%;height:100%;display:block;background:#000;border-radius:6px;touch-action:none}
  #ctl{display:none;width:100%;box-sizing:border-box;padding:6px 14px calc(8px + env(safe-area-inset-bottom));
    justify-content:flex-end;align-items:flex-end;gap:12px;pointer-events:none}
  #ctl button{border-radius:50%;border:2px solid rgba(255,255,255,.4);color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0;
    display:flex;align-items:center;justify-content:center;pointer-events:auto;opacity:.85}
  #ctl button svg{width:55%;height:55%;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  #ctl button.on{filter:brightness(1.6)}
  #ctl button.fire{width:62px;height:62px;background:rgba(255,90,90,.38);border-color:rgba(255,160,160,.75)}
  #ctl button.jump{width:52px;height:52px;background:rgba(90,170,255,.34);border-color:rgba(160,200,255,.75);margin-bottom:6px}
  /* analógico flutuante (igual ao Deadfront): toque e arraste na metade esquerda */
  #fsb{position:absolute;right:1.6%;top:1.4%;width:4%;max-width:34px;min-width:24px;aspect-ratio:1;display:none;align-items:center;justify-content:center;padding:0;
    background:rgba(10,8,25,.55);border:1px solid rgba(255,255,255,.4);border-radius:6px;z-index:6;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  body.fsok #fsb{display:flex}
  #fsb svg{width:68%;height:68%;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  #zone{position:fixed;left:0;bottom:0;width:58%;height:48dvh;touch-action:none;display:none;z-index:5}
  .stick-base{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);transform:translate(-50%,-50%);display:none;pointer-events:none}
  .stick-knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.55)}
  #zone.active .stick-base{display:block}
  @media (pointer:coarse){
    #ctl{display:flex;position:fixed;left:auto;right:0;bottom:0;width:auto;flex-direction:column;align-items:center;gap:18px;padding:0 max(22px,env(safe-area-inset-right)) calc(44px + env(safe-area-inset-bottom)) 0}
    #ctl button{position:relative}
    #ctl button::after{content:"";position:absolute;inset:-9px;border-radius:50%}
    #ctl button.jump{width:64px;height:64px;margin-bottom:0}
    #ctl button.fire{width:76px;height:76px}
    #app{--ctl:0px}
    body.playing #zone{display:block}
    body:not(.playing) #ctl{display:none}
  }
  @media (pointer:coarse) and (orientation:landscape){
    #app{--ctl:0px}
    #ctl{gap:16px;padding:0 max(22px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) 0}
    #ctl button.jump{width:52px;height:52px}
    #ctl button.fire{width:62px;height:62px}
    #zone{height:72dvh;width:50%}
  }
</style>
</head>

<canvas id="amb" aria-hidden="true"></canvas>
<div id="app">
  <div id="stage"><canvas id="c"></canvas><button id="fsb" aria-label="Tela cheia" title="Tela cheia (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  <div id="zone"><div class="stick-base"><div class="stick-knob"></div></div></div>
  <div id="ctl">
    <button data-k="jump" class="jump" aria-label="Pular"><svg viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    <button data-k="fire" class="fire" aria-label="Magia"><svg viewBox="0 0 24 24"><path d="M4 20 14 10"/><path d="M17 3l1.2 2.8L21 7l-2.8 1.2L17 11l-1.2-2.8L13 7l2.8-1.2z" fill="#fff"/><path d="M7 4v3M5.5 5.5h3M20 14v3M18.5 15.5h3"/></svg></button>
</div>
</div>

function enterTutStep() {
  const t = S.tut, st = TUT_STEPS[t.step];
  t.t = 0; t.mv = 0; t.px = P.x; t.jumped = false; t.n = 0; t.ps = shots.length; t.got = null;
  if (st.enter) st.enter();
  sfx.chime && sfx.chime();

function tutUpdate() {
  const t = S.tut; if (!t) return;
  t.t++;
  const st = TUT_STEPS[t.step];
  if (t.step === 0) { if (P.onGround && !P.climb) t.mv += Math.abs(P.x - t.px); t.px = P.x; }
  if (!P.onGround && !P.climb) t.jumped = true;
  if (P.climb) t.climbed = true;
  if (shots.length > t.ps) t.n++; t.ps = shots.length;
  if (st.keep && !t.got && !items.some(i => i.type === (st.keep().type))) items.push(st.keep());
  if (t.step === 3 && slimes.length === 0 && t.t === 1) { /* nada */ }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

}

  let g = FLOOR;
  for (const b of blocks) if (x > b.x - 2 && x < b.x + b.w + 2 && b.y >= feet - 3 && b.y < g) g = b.y;
  return g;
}

function updatePlayer() {
  const k = input, mv = (k.right ? 1 : 0) - (k.left ? 1 : 0);

      else if (P.y + P.h >= FLOOR) { P.y = FLOOR - P.h; P.climb = false; P.onGround = true; }

    }

      shots.push({ id: ++S.uid, x, anchor, top: oy, bottom: oy + 3, vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp, kind: 'pellet', wk: S.weapon, state: 'fly', t: 0, ceil: TOP }); }

  { const c = spellColor(S.weapon), ox = x + P.face * 12, oy = P.y - 6; sparks(ox, oy, c, 8, 3.5); ring(ox, oy, 22, c, 14, 2); }

function updateShots() {
  for (let i = shots.length - 1; i >= 0; i--) {
    const sh = shots[i], w = WEAPONS[sh.wk];
    if (sh.state === 'fly' && sh.kind === 'pellet') {
      sh.x += sh.vx; sh.top += sh.vy; sh.bottom = sh.top + 3;
      if (S.tick % 2 === 0) emit({ kind: 'spark', x: sh.x, y: sh.top, vx: rnd(-.3, .3), vy: rnd(-.3, .3), g: 0, life: 10, c: spellColor(sh.wk), r: 1.3 });
      if (sh.x < -8 || sh.x > W + 8 || sh.top <= TOP || blocks.some(b => sh.x > b.x && sh.x < b.x + b.w && sh.top > b.y && sh.top < b.y + b.h)) { shots.splice(i, 1); continue; }
    } else if (sh.state === 'fly') {
      sh.top -= w.speed * shotMul();
      if (sh.kind === 'rope' && S.tick % 2 === 0) emit({ kind: 'spark', x: sh.x + rnd(-3, 3), y: sh.top, vx: rnd(-.6, .6), vy: rnd(0, 1), g: .05, life: 16, c: spellColor(sh.wk), r: 1.4 });

        if (sh.kind === 'rope') { sh.state = 'stuck'; sh.t = 0; } else { shots.splice(i, 1); continue; }
      }
    } else {
      sh.t++;
      if (sh.t >= stickTime(w)) { shots.splice(i, 1); continue; }
    }
    // colisão com slimes
    let gone = false;
    for (const s of slimes.slice()) {
      if (s.imm > 0 && s.immShot === sh.id) continue;
      if (s.boss && s.hitCd > 0) continue;
      if (Math.abs(sh.x - s.x) > s.r) continue;
      const cy = clamp(s.y, sh.top, sh.bottom), dx = sh.x - s.x, dy = cy - s.y;
      if (dx * dx + dy * dy <= s.r * s.r) {

        if (!w.pierce) { shots.splice(i, 1); gone = true; break; }
      }
    }
    if (gone) continue;
    for (const f of flyers.slice()) {                       // colisão com voadores
      if ((f.k === 'ghost' && !f.solid) || f.imm > 0) continue;
      if (Math.abs(sh.x - f.x) > f.r) continue;
      const cy = clamp(f.y, sh.top, sh.bottom), dx = sh.x - f.x, dy = cy - f.y;
      if (dx * dx + dy * dy <= f.r * f.r) {

        if (!w.pierce) { shots.splice(i, 1); break; }
      }

      if (dx * dx + dy * dy <= (wisp.r + 3) * (wisp.r + 3)) { killWisp(sh); if (!w.pierce) { shots.splice(i, 1); } }
    }

}

}

function dropLoot(s) {

function popSlime(s, sh) {

// ---------- Efeitos de habilidades: fogo (Magmaísta) e familiar (Invocador) ----------
function nearestTarget(x, y) {

  for (const o of slimes.concat(flyers)) { if (o.k === 'ghost' && !o.solid) continue; const d = Math.hypot(o.x - x, o.y - y); if (d < bd) { bd = d; best = o; } }

    const dx = tg.x - b.x, dy = tg.y - b.y, d = Math.hypot(dx, dy) || 1;

}

// ---------- Voadores: morcego (ondas), fantasma (some e atravessa) e fênix (mergulha) ----------
const FLY = { bat: { r: 11, hp: 1, pts: 150 }, ghost: { r: 13, hp: 1, pts: 200 }, phoenix: { r: 15, hp: 2, pts: 350 },

function updateFlyers() {
  const px = P.x + P.w / 2, py = P.y + P.h / 2;

      f.base = mb ? 205 + Math.sin(f.t * (rage ? .016 : .011) + f.p) * 125 : 222 + Math.sin(f.t * .009 + f.p) * 138;          // sobe e desce devagar; no ponto baixo ameaça o mago

        f.y += (130 + Math.sin(f.p) * 12 - f.y) * .06; f.face = f.vx > 0 ? 1 : -1;

          f.dvx = dx / d * (big ? 8 : 6.4); f.vy = dy / d * (big ? 8 : 6.4); f.face = dx > 0 ? 1 : -1;
        }

        emit({ x: f.x, y: f.y, vx: rnd(-.5, .5), vy: rnd(-.5, .5), g: -.02, life: 20, r: 3.4, c: f.t % 2 ? '#ff7a1a' : '#ffd54a' });
        if (f.y >= FLOOR - 20 || f.x < f.r || f.x > W - f.r) {
          f.x = clamp(f.x, f.r, W - f.r); f.st = 'rise'; f.t = 0; ring(f.x, Math.min(f.y, FLOOR - 4), 26, '#ffb347', 14, 3); sparks(f.x, Math.min(f.y, FLOOR - 4), '#ffcf5a', 12, 5); S.shake = Math.max(S.shake, 4);
          if (big) { S.shake = 12; sfx.boom(); ring(f.x, FLOOR - 4, 130, '#ff9a3d', 24, 5); if (P.onGround && Math.abs(P.x + P.w / 2 - f.x) < 125 && !absorbFire()) hurt(); }   // onda de choque do impacto

function updateSlime(s) {
  if (s.slowT > 0) { if (S.tick % 7 === 0) smoke(s.x, s.y - s.r, '#bfe8ff', 1, .3); if (--s.slowT === 0) { s.vx /= .7; s.spd /= .7; } }
  if (s.imm > 0) s.imm--;
  if (s.hitCd > 0) s.hitCd--;
  if (s.flash > 0) s.flash--;
  if (s.sq > 0) s.sq = Math.max(0, s.sq - 0.04);
  s.vy += G; s.x += s.vx; s.y += s.vy;
  const r = s.r;
  if (s.x - r < 0) { s.x = r; s.vx = Math.abs(s.vx); }
  if (s.x + r > W) { s.x = W - r; s.vx = -Math.abs(s.vx); }
  if (s.y - r < TOP) { s.y = TOP + r; s.vy = Math.abs(s.vy); }
  if (s.y + r > FLOOR) { s.y = FLOOR - r; s.vy = -bounceV(s.size); s.sq = 0.28; }
  for (const b of blocks) {
    const cx = clamp(s.x, b.x, b.x + b.w), cy = clamp(s.y, b.y, b.y + b.h);
    const dx = s.x - cx, dy = s.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      if (d2 === 0) { s.y = b.y - r; s.vy = -bounceV(s.size); continue; }
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      s.x += nx * (r - d); s.y += ny * (r - d);
      if (Math.abs(ny) > Math.abs(nx)) {
        if (ny < 0) { s.vy = -bounceV(s.size); s.sq = 0.2; } else s.vy = Math.abs(s.vy);
      } else s.vx = nx > 0 ? Math.abs(s.vx) : -Math.abs(s.vx);
    }
  }
}

// cuspidores (size>=3) e chefes com spit disparam gosma na direção do jogador
function updateSpit(s) {

// ambiente de cada cenário (nuvens, neve, brasas, vaga-lumes...)

    ring(P.x + P.w / 2, P.y + P.h / 2, 60, '#7cc4ff', 20, 4);
    sparks(P.x + P.w / 2, P.y + P.h / 2, '#9fd4ff', 18, 6); S.shake = 8;
    return;
  }
  if (S.skin === 'necro' && !S.revUsed) {                // Pacto Sombrio: revive uma vez por fase
    S.revUsed = true; P.inv = 150; sfx.shield(); S.shake = 8; S.flashA = .4; S.flashC = '170,120,255';
    ring(P.x + P.w / 2, P.y + P.h / 2, 70, '#b18cff', 24, 4); sparks(P.x + P.w / 2, P.y + P.h / 2, '#d0b8ff', 20, 6);
    popup(P.x + P.w / 2, P.y - 10, 'REVIVEU!', '#d0b8ff', 16); return;
  }
  killPlayer();
}

function killPlayer() {
  S.state = 'dead'; S.timer = 100; S.lives--; sfx.hit(); Music.duck(1.6); S.shake = 14;
  P.dead = { x: P.x + P.w / 2, y: P.y + 17, vx: -P.face * 2.2, vy: -7, rot: 0, dir: -P.face };
  burst(P.x + P.w / 2, P.y + P.h / 2, '#ff5555', 18); sparks(P.x + P.w / 2, P.y + P.h / 2, '#ffd0d0', 14, 6);
}

function step() {
  S.tick++;
  const wasPressed = pressed; pressed = false;
  if (S.msgT > 0) S.msgT--;
  if (S.shake > 0) S.shake--;
  if (S.fade > 0) S.fade = Math.max(0, S.fade - 0.035);
  if (S.flashA > 0) S.flashA = Math.max(0, S.flashA - 0.05);
  if (S.windSweep > 0) S.windSweep--;
  if (S.timeFlash > 0) S.timeFlash--;
  if (S.slowmo > 0) S.slowmo--;
  if (!S.paused) updateAmb();
  if (S.freeze > 0 && S.state === 'play' && !S.paused) updateWind();

  if (S.state === 'menu') { slimes.forEach(updateSlime); return; }
  if (S.state === 'shop' || S.state === 'maps' || S.state === 'settings' || S.state === 'pick') return;
  if (S.tip) { S.tipT++; if (S.tipT > 40 && (wasPressed || jumpBuf > 0)) { S.tip = null; jumpBuf = 0; } return; }
  if (S.paused) { if (wasPressed) S.paused = false; return; }

  switch (S.state) {
    case 'ready':
      S.timer--;
      if (S.timer <= 0 || (wasPressed && S.timer < 140)) { S.state = 'play'; if (S.openN > 0) { startStrike(['fire', 'bolt', 'meteor'][Math.floor(Math.random() * 3)], S.openN); S.openN = 0; }
    if (S.frostN > 0) { startFreeze(300 + 75 * (S.frostN - 1)); S.frostN = 0; } }
      updateParts();
      break;
    case 'play':
      S.timeLeft--; S.lvT++; if (S.tut) { S.timeLeft = 9000 * 60; S.lvT = 0; }
      if (S.timeLeft <= 0) { killPlayer(); break; }
      if (S.shield > 0) S.shield--;
      if (S.freeze > 0) S.freeze--;
      if (S.magnet > 0) S.magnet--;
      if (S.demoCd > 0) S.demoCd--;
      if (S.slow > 0) S.slow--;
      updatePlayer(); handleFire(); updateShots();
      if (S.state !== 'play') break;
      updateSlimes(); updateFlyers(); updateWisp(); updateStrikes(); updatePerks(); updateGlobs(); updateFx(); updateItems(); updateParts();
      if (S.tut) { tutUpdate(); if (S.state !== 'play') break; }
      if (playerHit()) { hurt(); if (S.state !== 'play') break; }
      if (!S.tut && !slimes.length && !flyers.length) {
        S.state = 'clear'; S.timer = 200; sfx.clear();
        S.bonus = Math.floor(Math.max(0, S.timeLeft) / 60) * 10; addScore(S.bonus);
        const boss = isBossLv(S.cur);
        S.gained = S.inf ? (boss ? 25 : 5) : (boss ? 40 : 10); S.coins += S.gained;
        globs = []; puddles = [];
        const last = S.level >= LEVELS.length - 1;
        if (!S.inf) S.savedLevel = last ? 0 : S.level + 1;
        S.unlockMsg = '';
        if (!S.inf && S.cur.f === 2 && S.cur.map + 2 > S.unlocked && S.cur.map + 1 < MAPS.length) { S.unlocked = S.cur.map + 2; S.unlockMsg = 'Novo mapa: ' + MAPS[S.cur.map + 1].name + '!'; }
        if (S.rush) { if (S.score > S.rushBest.score) S.rushBest = { score: S.score, wave: S.wave }; } else if (S.inf) { if (S.score > S.infBest.score) S.infBest = { score: S.score, wave: S.wave }; } else S.best = Math.max(S.best, S.score);
        save();
      }
      break;
    case 'dead':
      S.timer--; updateParts(); updateFx(); updateGlobs();
      if (P.dead) { const d = P.dead; d.vy += 0.45; d.x += d.vx; d.y += d.vy; d.rot += 0.28 * d.dir; }
      if (S.timer <= 0) {
        if (S.lives <= 0) { S.state = 'over'; if (S.inf) recordRun(); else { S.best = Math.max(S.best, S.score); save(); } }
        else { S.weapon = 'harpoon'; startLevel(S.inf ? S.curL : S.level); P.inv = is('sangue') ? 300 : 120; }
      }
      break;
    case 'clear':
      S.timer--; updatePlayer(); updateParts(); updateItems(); updateFx();
      P.shoot = 8;
      if (P.onGround && S.timer % 40 === 0) jumpBuf = 3;
      if (S.tick % 2 === 0) emit({ kind: 'confetti', x: rnd(0, W), y: TOP, vx: rnd(-.6, .6), vy: rnd(1, 2.2), g: .02, life: 190, r: rnd(2.5, 4), c: ['#ff6b81', '#ffd34d', '#6cf08a', '#74d7ff', '#c9a6ff'][Math.floor(rnd(0, 5))], rot: rnd(0, TAU) });
      if (S.timer <= 0 || (wasPressed && S.timer < 150)) {
        if (S.rush && S.wave >= RUSH.length) { recordRun(); S.state = 'win'; }
        else if (S.inf && (S.rush || S.wave % 5 === 0)) { S.state = 'pick'; S.picks = rollPicks(); S.fade = 0; }     // bônus só depois de cada chefe (a cada 5 ondas)
        else if (S.inf) { S.wave++; startLevel(waveFor(S.wave)); }
        else if (S.level >= LEVELS.length - 1) S.state = 'win'; else startLevel(S.level + 1);
      }
      break;
    case 'over': case 'win':
      if (wasPressed) goMenu();
      break;
  }
}

function flash(msg) { S.msg = msg; S.msgT = 120; }
function buyOrEquip(kind, item, confirmed) {
  const owned = kind === 'skin' ? S.ownedSkins : S.ownedRopes;
  if (owned.includes(item.id)) { S[kind] = item.id; save(); flash(item.name + ' equipado!'); }
  else if (S.coins >= item.price && !confirmed) { S.confirm = { kind, item }; S.perk = null; }   // pede confirmação antes de gastar moedas
  else if (S.coins >= item.price) { S.coins -= item.price; owned.push(item.id); S[kind] = item.id; save(); flash(item.name + ' comprado!'); }
  else flash('Moedas insuficientes');
}
const IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());   // dentro do APK não há botão/opção de tela cheia
const FS_OK = !IS_APP && !!(document.documentElement && (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen));
function openSettings() {
  if (S.state === 'settings') return;
  S.setFrom = S.state === 'menu' ? 'menu' : 'play'; S.prevState = S.state; if (S.setFrom === 'play') S.paused = true;
  S.state = 'settings'; S.resetAsk = false; S.msg = ''; S.msgT = 0;
}
function leaveToMenu() { recordRun(); S.resetAsk = false; S.paused = false; S.tip = null; S.tut = null; goMenu(); }
function closeSettings() { S.resetAsk = false; S.state = S.setFrom === 'menu' ? 'menu' : S.prevState; }
function resetData() {
  try { localStorage.removeItem(KEY); localStorage.removeItem(OLD_KEY); } catch (e) {}
  S.savedLevel = 0; S.best = 0; S.coins = 0; S.score = 0; S.unlocked = 1; S.ownedSkins = ['hero']; S.ownedRopes = ['padrao']; S.skin = 'hero'; S.rope = 'padrao';
  S.seen = {}; S.tutDone = false; S.infBest = { score: 0, wave: 0 }; S.infTop = []; S.rushBest = { score: 0, wave: 0 }; S.rushTop = []; S.resetAsk = false; S.paused = false; save(); goMenu(); flash('Dados apagados');
}
function openShop() { S.confirm = null; S.state = 'shop'; S.msg = ''; S.msgT = 0; S.perk = null; S.shopPage = Math.floor(Math.max(0, SKINS.findIndex(k => k.id === S.skin)) / 5); S.ropePage = Math.floor(Math.max(0, ROPES.findIndex(k => k.id === S.rope)) / 6); }
function openMaps() { S.state = 'maps'; S.msg = ''; S.msgT = 0; }
function pickMap(m) { if (m < S.unlocked) newGame(m * 3); else flash('Vença o chefe do mapa anterior!'); }
const lvLabel = () => S.rush ? 'CHEFE ' + S.wave + '/' + RUSH.length : S.inf ? 'ONDA ' + S.wave : 'FASE ' + levelTag(S.level);
const doneLabel = () => S.rush ? 'CHEFE ' + S.wave + ' DERROTADO!' : 'ONDA ' + S.wave + ' COMPLETA!';
const levelTag = i => `${LEVELS[i].map + 1}-${LEVELS[i].f + 1}`;

function spellColor(wk) {
  if (wk === 'harpoon') return ropeNow().color;
  if (wk === 'twin') return S.rope === 'padrao' ? WEAPONS.twin.color : ropeNow().color;
  return WEAPONS[wk].color;
}

function drawFx() {
  for (const f of fx) {
    const k = f.t / f.life, rr = f.r * (0.4 + 0.6 * k);
    if (f.kind === 'ring') {
      ctx.globalAlpha = 1 - k; ctx.strokeStyle = f.color; ctx.lineWidth = (f.w || 3) * (1 - k * .6);
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * Math.sqrt(k), 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; continue;
    }
    const col = f.color || '255,140,40';
    ctx.globalAlpha = 1 - k;
    const g = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, Math.max(3, rr));
    g.addColorStop(0, 'rgba(255,255,230,.95)'); g.addColorStop(.35, `rgba(${col},.75)`); g.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(3, rr), 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,200,.9)'; ctx.lineWidth = 3 * (1 - k); ctx.beginPath(); ctx.arc(f.x, f.y, rr, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / (p.kind === 'smoke' ? p.max : 25), 0, 1);
    ctx.globalAlpha = p.kind === 'smoke' ? a * .35 : a; ctx.fillStyle = p.c; ctx.strokeStyle = p.c;
    switch (p.kind) {
      case 'spark':
        ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); ctx.stroke(); break;
      case 'text':
        ctx.globalAlpha = clamp(p.life / 20, 0, 1); txt(p.text, p.x, p.y, p.r, p.c); break;
      case 'star': {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * .15); ctx.fillRect(-p.r, -.8, p.r * 2, 1.6); ctx.fillRect(-.8, -p.r, 1.6, p.r * 2); ctx.restore(); break;
      }
      case 'snow':
        ctx.globalAlpha = a * .9; ctx.strokeStyle = '#e7f5ff'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 1.8, p.y - p.vy * 1.8); ctx.stroke(); circle(p.x, p.y, p.r * .7); break;
      case 'confetti':
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((p.rot || 0) + p.life * .1); ctx.scale(1, Math.abs(Math.sin(p.life * .12)) + .15); ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); ctx.restore(); break;
      default:
        circle(p.x, p.y, Math.max(.3, p.r));
    }
  }
  ctx.globalAlpha = 1;
}
