<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Popmancer</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif}
  #app{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;--ctl:0px}
  #stage{position:relative;width:min(100vw,calc((100dvh - var(--ctl))*16/9));aspect-ratio:16/9}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#000;border-radius:6px;touch-action:none}
  #ctl{display:none;width:100%;box-sizing:border-box;padding:6px 12px calc(8px + env(safe-area-inset-bottom));
    justify-content:space-between;align-items:flex-end;gap:8px}
  .grp{display:flex;gap:8px;align-items:flex-end}
  #ctl button{width:58px;height:58px;border-radius:16px;border:2px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14);color:#fff;font-size:24px;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
  #ctl button.on{background:rgba(255,255,255,.38)}
  #ctl button.fire{width:80px;height:80px;border-radius:50%;background:rgba(255,90,90,.35);border-color:rgba(255,160,160,.7);font-size:14px;font-weight:700}
  #ctl button.jump{width:68px;height:68px;border-radius:50%;background:rgba(90,170,255,.3);border-color:rgba(160,200,255,.7);font-size:13px;font-weight:700}
  #ctl .col{display:flex;flex-direction:column;gap:6px}
  #ctl .col button{height:36px}
  @media (pointer:coarse){
    #ctl{display:flex}
    #app{--ctl:112px}
  }
  @media (pointer:coarse) and (orientation:landscape){
    #app{--ctl:0px}
    #ctl{position:fixed;left:0;right:0;bottom:0;pointer-events:none}
    #ctl button{pointer-events:auto;opacity:.8}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="ctl">
    <div class="grp">
      <button data-k="left">◀</button>
      <button data-k="right">▶</button>
    </div>
    <div class="grp">
      <div class="col">
        <button data-k="up">▲</button>
        <button data-k="down">▼</button>
      </div>
      <button data-k="jump" class="jump">PULAR</button>
      <button data-k="fire" class="fire">MAGIA</button>
    </div>
  </div>
</div>

/* =====================================================================
   Estado
   ===================================================================== */
const cv = document.getElementById('c');
const scr = cv.getContext('2d'); scr.imageSmoothingEnabled = false;
let KS = 3;    // fator de ampliação do quadro pixel (400x225)
function fitCanvas() {
  const r = cv.getBoundingClientRect(), pr = window.devicePixelRatio || 1;
  const k = Math.min(8, Math.max(2, Math.round(((r.width || W) * pr) / 400)));
  if (k === KS && cv.width === 400 * k) return;
  KS = k; cv.width = 400 * k; cv.height = 225 * k; scr.imageSmoothingEnabled = false;
}
fitCanvas();
addEventListener('resize', fitCanvas);
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(cv);

const S = { state: 'menu', tick: 0, level: 0, lives: 3, score: 0, best: 0, savedLevel: 0,
            weapon: 'harpoon', timeLeft: 0, timer: 0, paused: false, fireCd: 0, uid: 0, muted: false,

let slimes = [], blocks = [], ladders = [], shots = [], items = [], parts = [], globs = [], puddles = [], fx = [], menuBtns = [], amb = [], clouds = [], windP = [], muteBtn = { x: 0, y: 0, w: 0, h: 0 };

            sq: 0, lean: 0, walking: false, dead: null };

const input = { left: false, right: false, up: false, down: false, fire: false };
let pressed = false;  // "apertou ação" (telas de texto)
let jumpBuf = 0;      // pedido de pulo (buffer de frames)

// ---------- Save ----------
const KEY = 'popmancer_v1', OLD_KEY = 'popnix_v1';
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD_KEY) || '{}');
    S.savedLevel = o.level || 0; S.best = o.best || 0; S.coins = o.coins || 0;
    S.ownedSkins = o.skins && o.skins.length ? o.skins : ['hero'];
    S.ownedRopes = o.ropes && o.ropes.length ? o.ropes : ['padrao'];
    S.skin = S.ownedSkins.includes(o.skin) ? o.skin : 'hero';
    S.rope = S.ownedRopes.includes(o.rope) ? o.rope : 'padrao';
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ level: S.savedLevel, best: S.best, coins: S.coins,
      skins: S.ownedSkins, ropes: S.ownedRopes, skin: S.skin, rope: S.rope }));
  } catch (e) {}
}
const skinNow = () => SKINS.find(k => k.id === S.skin) || SKINS[0];
const ropeNow = () => ROPES.find(k => k.id === S.rope) || ROPES[0];

// ---------- Áudio (tudo gerado por código, sem arquivos) ----------
let ac = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
const MUS_VOL = 0.5;

function initAudio() {
  if (ac) return ac;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain(); master.gain.value = S.muted ? 0 : 1;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp); comp.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musBus = ac.createGain(); musBus.gain.value = 0; musBus.connect(master);
    // reverb simples (impulso de ruído com decaimento)
    const conv = ac.createConvolver(), len = Math.floor(ac.sampleRate * 2.4), ib = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ib.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    conv.buffer = ib; const wet = ac.createGain(); wet.gain.value = 0.38;
    musBus.connect(conv); conv.connect(wet); wet.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
  return ac;
}
function setMuted(v) {
  S.muted = v;
  if (ac && master) master.gain.setTargetAtTime(v ? 0 : 1, ac.currentTime, 0.05);
}

function beep(f, d, type = 'square', v = 0.04, slide = 0, delay = 0) {
  if (S.muted || !initAudio()) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
// rajada de ruído filtrada (sopros, estouros, whoosh)
function noise(d, f0, f1, v = 0.08, type = 'bandpass', bus, delay = 0) {
  if (S.muted || !initAudio()) return;
  try {
    const t = ac.currentTime + delay, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; s.loop = true; fl.type = type; fl.Q.value = 1.2;
    fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(fl); fl.connect(g); g.connect(bus || sfxBus); s.start(t); s.stop(t + d + 0.02);
  } catch (e) {}
}
const sfx = {
  shoot: () => { beep(420, .14, 'sawtooth', .025, 900); beep(1200, .1, 'sine', .02, 800, .02); },
  pop:   (s) => { noise(.16, 1200, 250, .1); beep(380 - s * 30, .14, 'triangle', .06, -200); },
  hit:   () => { beep(200, .5, 'sawtooth', .06, -150); noise(.3, 800, 100, .08, 'lowpass'); },
  item:  () => { beep(660, .1, 'triangle', .05); beep(990, .14, 'triangle', .05, 0, .07); beep(1320, .18, 'sine', .04, 0, .14); },
  coin:  () => { beep(1318, .06, 'square', .025); beep(1760, .1, 'square', .025, 0, .05); },
  jump:  () => beep(260, .14, 'sine', .05, 360),
  land:  () => noise(.08, 500, 120, .05, 'lowpass'),
  boom:  () => { noise(.55, 1400, 70, .22, 'lowpass'); beep(110, .4, 'sine', .14, -70); },
  spit:  () => { beep(400, .18, 'sine', .05, -260); noise(.12, 900, 300, .04); },
  shield: () => { beep(900, .25, 'triangle', .06, -600); noise(.2, 3000, 800, .05); },
  boss:  () => { beep(150, .22, 'sawtooth', .07, -70); noise(.15, 600, 150, .06); },
  freeze: () => { noise(1.2, 3500, 500, .16); [1568, 2093, 2637, 3136].forEach((f, i) => beep(f, .5, 'sine', .035, 0, .05 + i * .09)); },
  clear: () => [523, 659, 784, 1046, 1318].forEach((f, i) => beep(f, .22, 'triangle', .06, 0, i * .11)),
};

// ---------- Música procedural ----------
// Cada trilha é uma tabela: andamento, tom, escala e progressão de acordes.
// kind 'calm' = pad suave + arpejo de alaúde + flauta | 'boss' = bateria, baixo e metais.
const Music = (() => {
  let cur = null, want = null, pending = null, timer = null, nextT = 0, stp = 0, seed = 1, intense = false;
  const SC = { major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10], minor: [0, 2, 3, 5, 7, 8, 10],
               lydian: [0, 2, 4, 6, 7, 9, 11], phryg: [0, 1, 3, 5, 7, 8, 10] };
  const TRACKS = {
    menu:   { kind: 'calm', bpm: 62, root: 62, scale: 'dorian', prog: [[0, 5, 3, 4], [0, 3, 5, 4]], arp: .5, bells: .15, drone: 0 },
    stage0: { kind: 'calm', bpm: 74, root: 64, scale: 'major',  prog: [[0, 5, 3, 4], [0, 3, 1, 4]], arp: .6, bells: 0,   drone: 0 },
    stage1: { kind: 'calm', bpm: 58, root: 57, scale: 'minor',  prog: [[0, 5, 2, 6], [0, 3, 4, 0]], arp: .4, bells: .1,  drone: 1 },
    stage2: { kind: 'calm', bpm: 66, root: 65, scale: 'lydian', prog: [[0, 1, 0, 4], [0, 5, 1, 4]], arp: .35, bells: .6, drone: 0 },
    stage3: { kind: 'calm', bpm: 64, root: 52, scale: 'phryg',  prog: [[0, 1, 0, 6], [0, 5, 1, 0]], arp: .35, bells: .1, drone: 1 },
    stage4: { kind: 'calm', bpm: 60, root: 60, scale: 'dorian', prog: [[0, 3, 0, 4], [0, 5, 3, 4]], arp: .3, bells: .2,  drone: 1 },
    boss:   { kind: 'boss', bpm: 128, root: 50, scale: 'minor', prog: [[0, 5, 6, 4], [0, 5, 2, 6]] },
  };
  const rng = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const note = (tr, deg, oct = 0) => { const sc = SC[tr.scale]; return tr.root + sc[((deg % 7) + 7) % 7] + 12 * (Math.floor(deg / 7) + oct); };
  const stepDur = tr => 60 / (tr.bpm * (intense ? 1.1 : 1)) / 2;

  // ---- vozes ----
  function voice(type, m, t, dur, vol, o = {}) {
    const osc = ac.createOscillator(), g = ac.createGain(), a = o.a || 0.01, r = o.r || 0.12;
    osc.type = type; osc.frequency.value = mtof(m); if (o.det) osc.detune.value = o.det;
    let n = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); n = f; }
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
    if (o.decay) g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    else { g.gain.setValueAtTime(vol, t + Math.max(a, dur - r)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + r); }
    if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5; lg.gain.value = o.vib; l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + dur + r + .05); }
    n.connect(g); g.connect(musBus); osc.start(t); osc.stop(t + dur + r + 0.05);
  }
  const pluck = (m, t, v, type = 'triangle', d = 0.7) => voice(type, m, t, d, v, { a: 0.005, decay: true });
  const bell = (m, t, v) => { const f = mtof(m), o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o2.type = 'sine'; o.frequency.value = f; o2.frequency.value = f * 2.76;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    o.connect(g); o2.connect(g); g.connect(musBus); o.start(t); o2.start(t); o.stop(t + 2.3); o2.stop(t + 2.3); };
  const kick = t => { const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + .16);
    g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
    o.connect(g); g.connect(musBus); o.start(t); o.stop(t + .25); };
  const tom = (t, f) => { const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * .55, t + .2);
    g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.0001, t + .24);
    o.connect(g); g.connect(musBus); o.start(t); o.stop(t + .26); };

  function schedule(tr, st, t) {
    const sd = stepDur(tr), bar = Math.floor(st / 8), s = st % 8;
    const d = tr.prog[Math.floor(bar / 4) % tr.prog.length][bar % 4];
    if (tr.kind === 'calm') {
      if (s === 0) {
        for (const k of [0, 2, 4]) { voice('triangle', note(tr, d + k, 0), t, sd * 8, .05, { a: .9, r: .9, lp: 1400 });
                                    voice('sine', note(tr, d + k, 1), t, sd * 8, .022, { a: 1.2, r: .9, det: 6 }); }
        voice('sine', note(tr, d, -1), t, sd * 4, .11, { a: .05, r: .4 });
        if (tr.drone && bar % 2 === 0) voice('sine', note(tr, 0, -2), t, sd * 16, .09, { a: 1.5, r: 1.5 });
        if (rng() < .55) voice('sine', note(tr, d + [0, 2, 4, 5][Math.floor(rng() * 4)], 1), t + sd * .5, sd * 5, .06, { a: .25, r: .5, vib: 5 });
      }
      if (s === 4) voice('sine', note(tr, d + 4, -1), t, sd * 3, .07, { a: .05, r: .3 });
      if (rng() < tr.arp) { const pool = [d, d + 2, d + 4, d + 7, d + 9]; pluck(note(tr, pool[Math.floor(rng() * pool.length)], 1), t, .075); }
      if (tr.bells && s % 4 === 2 && rng() < tr.bells) bell(note(tr, [0, 2, 4, 7, 9][Math.floor(rng() * 5)] + d, 2), t, .035);
    } else {
      if (s === 0 || s === 4 || (s === 3 && bar % 2)) kick(t);
      if (s === 2 || s === 6) { noiseHit(t, .13, .16, 'highpass', 1800, 900); }
      noiseHit(t, .04, s % 2 ? .035 : .06, 'highpass', 7000, 0);
      if (bar % 4 === 3 && s >= 5) tom(t, [180, 150, 120][s - 5]);
      voice('sawtooth', note(tr, d, -1) + (s === 3 || s === 7 ? 12 : 0), t, sd * .9, s ? .06 : .09, { a: .005, r: .05, lp: 700 });
      if (s === 0) for (const k of [0, 4]) voice('sawtooth', note(tr, d + k, 0), t, sd * 8, .035, { a: .15, r: .3, lp: 900 });
      if (s === 0 || s === 3 || (intense && s === 6)) for (const k of [0, 2, 4]) voice('sawtooth', note(tr, d + k, 1), t, sd * 1.1, .03, { a: .02, r: .1, lp: 1800 });
      const riff = bar % 2 ? [4, -1, 3, 2, -1, 0, 2, -1] : [0, -1, 2, 3, -1, 2, 0, -1];
      if (riff[s] >= 0) voice('square', note(tr, d + riff[s], 2), t, sd * 1.4, .04, { a: .01, r: .1, lp: 2600 });
    }
  }
  function noiseHit(t, dur, vol, type, f0, f1) { noise(dur, f0, f1 || null, vol, type, musBus, t - ac.currentTime); }

  function tick() {
    if (!ac || ac.state !== 'running' || !cur || S.muted) { if (ac && cur && nextT < ac.currentTime) nextT = ac.currentTime + .05; return; }
    const tr = TRACKS[cur];
    if (nextT < ac.currentTime - .5) nextT = ac.currentTime + .05;
    while (nextT < ac.currentTime + .3) { try { schedule(tr, stp, nextT); } catch (e) {} nextT += stepDur(tr); stp++; }
  }
  function start(name) {
    cur = name; pending = null; stp = 0; seed = name.length * 7919 + 1; intense = false;
    nextT = ac.currentTime + .05;
    musBus.gain.cancelScheduledValues(ac.currentTime); musBus.gain.setTargetAtTime(MUS_VOL, ac.currentTime, .5);
    if (!timer) timer = setInterval(tick, 80);
  }
  return {
    TRACKS,
    get current() { return cur; },
    play(name) {
      want = name;
      if (!ac || cur === name || pending === name) return;
      pending = name;
      if (!cur) { start(name); return; }
      musBus.gain.cancelScheduledValues(ac.currentTime); musBus.gain.setTargetAtTime(0, ac.currentTime, .12);
      setTimeout(() => { if (want === name && ac) start(name); else pending = null; }, 450);
    },
    unlock() { initAudio(); if (ac && ac.state === 'suspended') ac.resume(); if (ac && want && !cur) { const w = want; want = null; this.play(w); } },
    setIntense(v) { intense = v; },
    duck(sec) { if (!ac || !cur) return; musBus.gain.setTargetAtTime(MUS_VOL * .25, ac.currentTime, .05);
      setTimeout(() => { if (ac && cur) musBus.gain.setTargetAtTime(MUS_VOL, ac.currentTime, .4); }, sec * 1000); },
    suspend() { if (ac && ac.state === 'running') ac.suspend(); },
  };
})();

/* =====================================================================
   Criação de entidades
   ===================================================================== */
function mkSlime(x, y, size, dir, spd, color, type) {
  return { id: ++S.uid, x, y, size, r: R[size], vx: dir * spd, vy: 0, spd, color, type: type || 'normal',
           sq: 0, imm: 0, immShot: 0, hitCd: 0, flash: 0, spitT: 90 + Math.floor(Math.random() * 90),
           boss: null, hp: 0, maxhp: 0, enraged: false };
}

function startLevel(i) {
  S.level = i; const L = LEVELS[i]; S.cur = L;
  const spd = L.spd || 1.4;
  slimes = L.slimes.map(d => {
    const s = mkSlime(d.x, d.y, d.size, d.dir, spd, d.color || TYPE_COLOR[d.type] || L.color || '#5fd35f', d.type);
    if (d.boss) { const B = BOSSES[d.boss]; s.boss = B; s.hp = s.maxhp = B.hp; s.color = B.color; }
    return s;
  });
  blocks = L.blocks || [];
  ladders = (L.ladders || []).map(l => ({ x: l.x, y: l.y, w: 26, h: l.h }));
  shots = []; items = []; parts = []; globs = []; puddles = []; fx = [];
  Object.assign(P, { x: W / 2 - P.w / 2, y: FLOOR - P.h, vy: 0, climb: false, ladder: null, onGround: true, inv: 0, shoot: 0, face: 1, sq: 0, lean: 0, walking: false, dead: null });
  S.timeLeft = L.time * 60; S.timer = 170; S.fireCd = 0;
  S.shield = 0; S.freeze = 0; S.slow = 0; S.shake = 0; jumpBuf = 0; S.fade = 1; S.windSweep = 0; S.slowmo = 0; S.flashA = 0;
  initAmb(L.theme); Music.setIntense(false);
  Music.play(L.slimes.some(d => d.boss) ? 'boss' : 'stage' + L.theme);
  S.state = 'ready';
}

function newGame(fromLevel) {
  S.lives = 3; S.score = 0; S.weapon = 'harpoon';
  startLevel(fromLevel);
}

function goMenu() {
  S.state = 'menu'; blocks = []; ladders = []; shots = []; items = []; parts = []; globs = []; puddles = []; fx = [];
  S.freeze = 0; S.fade = 0; initAmb(0); Music.setIntense(false); Music.play('menu');
  slimes = [];
  const cols = ['#5fd35f', '#4aa8ff', '#b04aff', '#ff7a2f', '#c9e03a'];
  const types = [null, null, null, 'explosive', 'spitter'];
  for (let i = 0; i < 6; i++) slimes.push(mkSlime(80 + i * 130, 150 + (i % 3) * 40, 1 + (i % 4), i % 2 ? 1 : -1, 1.2, cols[i % 5], types[i % 5]));
}

/* =====================================================================
   Lógica
   ===================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

function ceilingFor(x, anchor) {
  let c = TOP;
  for (const b of blocks) if (x >= b.x - 2 && x <= b.x + b.w + 2 && b.y + b.h <= anchor + 1) c = Math.max(c, b.y + b.h);
  return c;
}
function groundBelow(x, feet) {
  let g = FLOOR;
  for (const b of blocks) if (x > b.x - 2 && x < b.x + b.w + 2 && b.y >= feet - 3 && b.y < g) g = b.y;
  return g;
}

function updatePlayer() {
  const k = input, mv = (k.right ? 1 : 0) - (k.left ? 1 : 0);
  const feetPrev = P.y + P.h;
  const slow = S.slow > 0, wasGround = P.onGround;
  P.lean += ((P.walking ? P.face * 0.09 : 0) + (P.shoot > 6 ? P.face * 0.1 : 0) - P.lean) * 0.25;
  P.sq *= 0.82;
  if (S.tick % 4 === 0 && S.state === 'play') emit({ kind: 'star', x: P.x + P.w / 2 + P.face * 12 + rnd(-3, 3), y: P.y - 6 + rnd(-3, 3), vx: rnd(-.3, .3), vy: rnd(-.5, -.1), g: -0.01, life: 24, r: 2, c: spellColor(S.weapon) });
  if (P.shoot > 0) P.shoot--;
  if (P.inv > 0) P.inv--;
  if (jumpBuf > 0) jumpBuf--;

  if (P.climb) {
    P.walking = false;
    const l = P.ladder, dy = ((k.down ? 1 : 0) - (k.up ? 1 : 0)) * (slow ? 1.4 : 2.3);
    P.y += dy; P.vy = 0; P.anim += Math.abs(dy) * 0.18;
    if (mv !== 0 && dy === 0) { P.climb = false; }
    else {
      P.x = l.x + l.w / 2 - P.w / 2;
      if (P.y + P.h <= l.y) { P.y = l.y - P.h; P.climb = false; P.onGround = true; }
      else if (P.y + P.h >= FLOOR) { P.y = FLOOR - P.h; P.climb = false; P.onGround = true; }
      return;
    }
  }

  if (mv) { P.x += mv * (slow ? 1.4 : 3.1); P.face = mv; P.anim += slow ? 0.12 : 0.28; }
  P.walking = mv !== 0;
  P.x = clamp(P.x, 0, W - P.w);

  // subir / descer escada (tem prioridade sobre o pulo)
  if (k.up || k.down) {
    const cx = P.x + P.w / 2, feet = P.y + P.h;
    for (const l of ladders) {
      if (cx > l.x - 4 && cx < l.x + l.w + 4) {
        const up = k.up && feet > l.y + 1 && feet <= l.y + l.h + 2;
        const down = k.down && feet >= l.y - 3 && feet < l.y + l.h - 1;
        if (up || down) {
          P.climb = true; P.ladder = l; P.vy = 0; P.x = l.x + l.w / 2 - P.w / 2; jumpBuf = 0;
          if (down && feet <= l.y + 1) P.y = l.y - P.h + 4;
          return;
        }
      }
    }
  }

  // pulo
  if (jumpBuf > 0 && P.onGround) { P.vy = -(slow ? JUMP_V * 0.82 : JUMP_V); P.onGround = false; jumpBuf = 0; sfx.jump(); P.sq = -0.22; smoke(P.x + P.w / 2, P.y + P.h, '#c9b99a', 3, .2); }

  // gravidade + pouso (chão e topo de blocos)
  P.vy = Math.min(P.vy + PG, 12); P.y += P.vy;
  const vImp = P.vy, feet = P.y + P.h; P.onGround = false;
  if (feet >= FLOOR) { P.y = FLOOR - P.h; P.vy = 0; P.onGround = true; }
  else for (const b of blocks) {
    if (P.vy >= 0 && feetPrev <= b.y + 1 && feet >= b.y && P.x + P.w > b.x + 2 && P.x < b.x + b.w - 2) {
      P.y = b.y - P.h; P.vy = 0; P.onGround = true; break;
    }
  }
  if (P.onGround && !wasGround && vImp > 3) { P.sq = Math.min(0.32, vImp * 0.03); smoke(P.x + P.w / 2, P.y + P.h, '#c9b99a', 4, .25); sfx.land(); }
  if (P.onGround && P.walking && S.tick % 9 === 0) smoke(P.x + P.w / 2 - P.face * 6, P.y + P.h - 1, '#c9b99a', 1, .15);
  // poças de gosma deixam o jogador lento
  if (P.onGround) {
    const f = P.y + P.h;
    for (const p of puddles) if (Math.abs(f - p.y) < 4 && P.x + P.w > p.x - p.w / 2 && P.x < p.x + p.w / 2) S.slow = Math.max(S.slow, 12);
  }
}

function handleFire() {
  if (S.fireCd > 0) S.fireCd--;
  if (!input.fire || S.fireCd > 0 || P.climb) return;
  const w = WEAPONS[S.weapon];
  if (shots.length >= w.max) return;
  const x = P.x + P.w / 2, feet = P.y + P.h;
  const anchor = w.kind === 'rope' ? groundBelow(x, feet) : feet;
  shots.push({ id: ++S.uid, x, anchor, top: anchor - 8, bottom: w.kind === 'rope' ? anchor : anchor - 8 + 14,
               kind: w.kind, wk: S.weapon, state: 'fly', t: 0, ceil: ceilingFor(x, anchor) });
  S.fireCd = w.cd; P.shoot = 12; sfx.shoot();
  { const c = spellColor(S.weapon), ox = x + P.face * 12, oy = P.y - 6; sparks(ox, oy, c, 8, 3.5); ring(ox, oy, 22, c, 14, 2); }
}

function updateShots() {
  for (let i = shots.length - 1; i >= 0; i--) {
    const sh = shots[i], w = WEAPONS[sh.wk];
    if (sh.state === 'fly') {
      sh.top -= w.speed;
      if (sh.kind === 'rope' && S.tick % 2 === 0) emit({ kind: 'spark', x: sh.x + rnd(-3, 3), y: sh.top, vx: rnd(-.6, .6), vy: rnd(0, 1), g: .05, life: 16, c: spellColor(sh.wk), r: 1.4 });
      if (sh.kind === 'bullet') sh.bottom = sh.top + 14;
      if (sh.top <= sh.ceil) {
        sh.top = sh.ceil;
        if (sh.kind === 'rope') { sh.state = 'stuck'; sh.t = 0; } else { shots.splice(i, 1); continue; }
      }
    } else {
      sh.t++;
      if (sh.t >= w.stick) { shots.splice(i, 1); continue; }
    }
    // colisão com slimes
    for (const s of slimes.slice()) {
      if (s.imm > 0 && s.immShot === sh.id) continue;
      if (s.boss && s.hitCd > 0) continue;
      if (Math.abs(sh.x - s.x) > s.r) continue;
      const cy = clamp(s.y, sh.top, sh.bottom), dx = sh.x - s.x, dy = cy - s.y;
      if (dx * dx + dy * dy <= s.r * s.r) {
        if (s.boss) hitBoss(s, w.dmg || 1); else popSlime(s, sh);
        if (!w.pierce) { shots.splice(i, 1); break; }
      }
    }
  }
}

function weightedDrop() {
  let t = 0; for (const d of DROPS) t += d[1];
  let r = Math.random() * t;
  for (const d of DROPS) { r -= d[1]; if (r <= 0) return d[0]; }
  return DROPS[0][0];
}

function dropLoot(s) {
  if (Math.random() < (s.size >= 2 ? 0.13 : 0.04))
    items.push({ x: s.x, y: s.y, vy: -3, vx: 0, type: weightedDrop(), t: 0 });
  if (Math.random() < 0.45)
    items.push({ x: s.x, y: s.y, vy: -4, vx: rnd(-1.5, 1.5), type: 'coin', val: s.size >= 4 ? 3 : s.size >= 2 ? 2 : 1, t: 0 });
}

const TAU = Math.PI * 2;
function emit(o) {
  const p = Object.assign({ kind: 'dot', vx: 0, vy: 0, g: 0.18, drag: 1, life: 30, r: 3, grow: 0, c: '#fff' }, o);
  p.max = p.life; parts.push(p); if (parts.length > 500) parts.shift();
}
function burst(x, y, color, n, spd = 3) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = 1 + Math.random() * spd;
    emit({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, life: 30 + Math.random() * 20, c: color, r: 2 + Math.random() * 3 }); }
}
function sparks(x, y, color, n, spd = 5) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, v = 1 + Math.random() * spd;
    emit({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, g: 0.12, drag: 0.97, life: 18 + Math.random() * 14, c: color, r: 1.6 }); }
}
function smoke(x, y, color, n, up = 0.6) {
  for (let i = 0; i < n; i++) emit({ kind: 'smoke', x: x + rnd(-6, 6), y, vx: rnd(-.4, .4), vy: -up * rnd(.5, 1.2), g: 0, drag: .98, life: 40 + Math.random() * 25, r: 4 + Math.random() * 4, grow: .25, c: color });
}
function popup(x, y, text, color, size = 13) { emit({ kind: 'text', x, y, vy: -0.9, g: 0, drag: 0.97, life: 55, text, c: color, r: size }); }
function ring(x, y, r, color, life = 18, w = 3) { fx.push({ kind: 'ring', x, y, r, t: 0, life, color, w }); }

function popSlime(s, sh) {
  const idx = slimes.indexOf(s); if (idx < 0) return;
  slimes.splice(idx, 1);
  const pts = 100 + (5 - Math.min(s.size, 5)) * 50; S.score += pts;
  sfx.pop(s.size);
  burst(s.x, s.y, s.color, 8 + s.size * 2);
  sparks(s.x, s.y, sh ? spellColor(sh.wk) : '#fff', 8, 4); ring(s.x, s.y, s.r * 1.5, sh ? spellColor(sh.wk) : '#fff', 14, 2);
  popup(s.x, s.y - s.r, '+' + pts, '#ffe27a', 12);
  if (s.type === 'explosive') explode(s);
  if (s.size > 1) {
    for (const dir of [-1, 1]) {
      const c = mkSlime(s.x + dir * s.r * 0.5, s.y, s.size - 1, dir, s.spd, s.color, s.type);
      c.vy = -4.5; c.imm = 25; c.immShot = sh ? sh.id : 0;
      slimes.push(c);
    }
  }
  dropLoot(s);
}

function explode(s) {
  const er = 30 + s.size * 12;
  fx.push({ x: s.x, y: s.y, r: er, t: 0, life: 22 });
  S.shake = Math.max(S.shake, 8 + s.size * 2); sfx.boom();
  burst(s.x, s.y, '#ffb347', 14, 5);
  ring(s.x, s.y, er * 1.3, '#ffe0a0', 24, 4); sparks(s.x, s.y, '#ffcf5a', 22, 7); smoke(s.x, s.y, '#555a66', 8);
  S.flashA = 0.35; S.flashC = '255,200,120';
  const dx = (P.x + P.w / 2) - s.x, dy = (P.y + P.h / 2) - s.y;
  if (Math.hypot(dx, dy) < er + 8 && S.state === 'play') hurt();
}

function hitBoss(s, dmg) {
  s.hp -= dmg; s.hitCd = 8; s.flash = 8; S.score += 50; sfx.boss();
  burst(s.x, s.y - s.r * 0.3, '#fff', 6); sparks(s.x, s.y, '#fff', 10, 5); ring(s.x, s.y, s.r * 1.2, '#fff', 12, 3); S.shake = Math.max(S.shake, 6);
  if (s.hp <= 0) { killBoss(s); return; }
  if (!s.enraged && s.hp <= s.maxhp / 2) { s.enraged = true; s.vx *= 1.4; s.spd *= 1.4; S.shake = 14; Music.setIntense(true); popup(s.x, s.y - s.r - 10, 'FÚRIA!', '#ff6b6b', 22); }
  if (Math.floor(s.hp / 2) !== Math.floor((s.hp + dmg) / 2)) spawnMinion(s);
}

function spawnMinion(s) {
  const m = s.boss.minions[Math.floor(Math.random() * s.boss.minions.length)];
  const c = mkSlime(s.x, s.y - s.r * 0.4, m.size, Math.random() < .5 ? -1 : 1, S.cur.spd || 1.4,
                    TYPE_COLOR[m.type] || S.cur.color || '#5fd35f', m.type);
  c.vy = -6; c.imm = 20;
  slimes.push(c);
}

function killBoss(s) {
  S.score += 5000; S.shake = 40; sfx.boom(); sfx.clear(); S.slowmo = 45; S.flashA = 0.7; S.flashC = '255,255,255'; ring(s.x, s.y, 220, '#fff', 40, 6); sparks(s.x, s.y, '#fff', 40, 9);
  fx.push({ x: s.x, y: s.y, r: 140, t: 0, life: 40 });
  burst(s.x, s.y, s.color, 50, 7);
  for (let i = 0; i < 10; i++) items.push({ x: s.x, y: s.y, vy: rnd(-7, -3), vx: rnd(-3, 3), type: 'coin', val: 3, t: 0 });
  for (const o of slimes) if (o !== s) burst(o.x, o.y, o.color, 10);
  slimes.length = 0;
}

function updateSlime(s) {
  if (s.imm > 0) s.imm--;
  if (s.hitCd > 0) s.hitCd--;
  if (s.flash > 0) s.flash--;
  if (s.sq > 0) s.sq = Math.max(0, s.sq - 0.04);
  s.vy += G; s.x += s.vx; s.y += s.vy;
  const r = s.r;
  if (s.x - r < 0) { s.x = r; s.vx = Math.abs(s.vx); }
  if (s.x + r > W) { s.x = W - r; s.vx = -Math.abs(s.vx); }
  if (s.y - r < TOP) { s.y = TOP + r; s.vy = Math.abs(s.vy); }
  if (s.y + r > FLOOR) { s.y = FLOOR - r; s.vy = -bounceV(s.size); s.sq = 0.28; }
  for (const b of blocks) {
    const cx = clamp(s.x, b.x, b.x + b.w), cy = clamp(s.y, b.y, b.y + b.h);
    const dx = s.x - cx, dy = s.y - cy, d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      if (d2 === 0) { s.y = b.y - r; s.vy = -bounceV(s.size); continue; }
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
      s.x += nx * (r - d); s.y += ny * (r - d);
      if (Math.abs(ny) > Math.abs(nx)) {
        if (ny < 0) { s.vy = -bounceV(s.size); s.sq = 0.2; } else s.vy = Math.abs(s.vy);
      } else s.vx = nx > 0 ? Math.abs(s.vx) : -Math.abs(s.vx);
    }
  }
}

// cuspidores (size>=3) e chefes com spit disparam gosma na direção do jogador
function updateSpit(s) {
  const can = s.boss ? s.boss.spit : (s.type === 'spitter' && s.size >= 3);
  if (!can) return;
  if (--s.spitT > 0) return;
  s.spitT = (s.boss ? (s.enraged ? 70 : 130) : 170) + Math.floor(Math.random() * 50);
  const tx = P.x + P.w / 2, ty = P.y + P.h / 2, dx = tx - s.x, dy = ty - s.y, d = Math.hypot(dx, dy) || 1, sp = 3.4;
  globs.push({ x: s.x, y: s.y - s.r * 0.3, vx: dx / d * sp, vy: dy / d * sp - 1.2 });
  sfx.spit();
}

function updateSlimes() {
  for (const s of slimes) {
    if (S.freeze > 0) {
      if (s.imm > 0) s.imm--; if (s.hitCd > 0) s.hitCd--; if (s.flash > 0) s.flash--;
      s.sq = Math.max(0, s.sq - 0.04);
      if ((S.tick + s.id) % 22 === 0) smoke(s.x, s.y - s.r, '#dff4ff', 1, .35);
    } else {
      updateSlime(s); updateSpit(s);
      if (s.boss && s.enraged && S.tick % 7 === 0) smoke(s.x + rnd(-s.r, s.r) * .8, s.y - s.r * 1.6, '#c0392b', 1, .8);
      if (s.type === 'explosive' && S.tick % 9 === 0) emit({ kind: 'spark', x: s.x + s.r * .35, y: s.y - s.r * 2.1, vx: rnd(-.5, .5), vy: rnd(-1.5, -.5), g: .03, life: 14, c: '#ffd34d', r: 1.5 });
      if (s.type === 'spitter' && S.tick % 40 === (s.id % 40)) emit({ x: s.x + rnd(-s.r, s.r) * .5, y: s.y - s.r * .3, vy: 1, g: .15, life: 25, c: '#b6e03a', r: 2 });
    }
  }
}

function addPuddle(x, y) {
  puddles.push({ x, y, w: 54, life: 420 });
  if (puddles.length > 10) puddles.shift();
}

function updateGlobs() {
  for (let i = globs.length - 1; i >= 0; i--) {
    const g = globs[i], py = g.y;
    g.vy += 0.07; g.x += g.vx; g.y += g.vy;
    if (g.x < -10 || g.x > W + 10 || g.y > H + 10 || g.y < -20) { globs.splice(i, 1); continue; }
    if (g.x > P.x - 3 && g.x < P.x + P.w + 3 && g.y > P.y && g.y < P.y + P.h) {
      globs.splice(i, 1); burst(g.x, g.y, '#b6e03a', 8);
      if (S.shield > 0) sfx.shield(); else S.slow = 240;
      continue;
    }
    let landed = null;
    if (g.y >= FLOOR - 2) landed = FLOOR;
    else for (const b of blocks) {
      if (g.x > b.x && g.x < b.x + b.w && g.y >= b.y && g.y <= b.y + b.h) { landed = py <= b.y + 1 ? b.y : -1; break; }
    }
    if (landed !== null) { globs.splice(i, 1); burst(g.x, g.y, '#b6e03a', 5); if (landed > 0) addPuddle(g.x, landed); }
  }
  for (let i = puddles.length - 1; i >= 0; i--) if (--puddles[i].life <= 0) puddles.splice(i, 1);
}

function updateFx() {
  for (let i = fx.length - 1; i >= 0; i--) if (++fx[i].t > fx[i].life) fx.splice(i, 1);
}

function pickItem(it) {
  if (it.type === 'coin') { S.coins += it.val; sfx.coin(); save(); emit({ kind: 'star', x: it.x, y: it.y, vy: -.8, g: 0, life: 20, r: 3, c: '#ffe27a' }); return; }
  const d = ITEMS[it.type];
  sfx.item(); S.score += 50; sparks(it.x, it.y, d.color, 12, 4); ring(it.x, it.y, 26, d.color, 16, 2);
  popup(P.x + P.w / 2, P.y - 8, d.name, d.color, 13);
  if (WEAPONS[it.type]) S.weapon = it.type;
  else if (it.type === 'shield') S.shield = 600;
  else if (it.type === 'freeze') startFreeze();
  else if (it.type === 'clock') { S.timeLeft += 20 * 60; S.timeFlash = 40; }
  else if (it.type === 'life') S.lives = Math.min(5, S.lives + 1);
}

// Nevasca: vento de gelo varre a tela e congela os slimes
function startFreeze() {
  S.freeze = 300; S.windSweep = 45; S.flashA = 0.55; S.flashC = '190,230,255'; sfx.freeze();
  const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
  ring(cx, cy, 130, '#bfe8ff', 30, 4);
  for (let i = 0; i < 30; i++) { const a = rnd(0, TAU), v = rnd(2, 7);
    emit({ kind: 'spark', x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .02, life: 36, c: '#dff4ff', r: 2 }); }
  initWind();
}
function initWind() { windP = []; for (let i = 0; i < 70; i++) windP.push({ x: rnd(0, W), y: rnd(TOP, FLOOR), v: rnd(14, 28), l: rnd(30, 90), p: rnd(0, TAU) }); }
function updateWind() {
  for (const w of windP) { w.x += w.v; w.p += .15; if (w.x - w.l > W) { w.x = -rnd(0, 80); w.y = rnd(TOP, FLOOR); } }
  if (S.tick % 3 === 0) emit({ kind: 'snow', x: -5, y: rnd(TOP, FLOOR), vx: rnd(6, 11), vy: rnd(-.5, 1), g: .02, life: 90, r: rnd(1.5, 3), c: '#fff' });
}

// ambiente de cada cenário (nuvens, neve, brasas, vaga-lumes...)
let ambKind = 'meadow';
function initAmb(ti) {
  const K = THEMES[ti].kind, n = { meadow: 20, dungeon: 30, ice: 90, volcano: 55, swamp: 36 }[K];
  ambKind = K; amb = []; clouds = [];
  for (let i = 0; i < n; i++) amb.push({ x: rnd(0, W), y: rnd(0, FLOOR), p: rnd(0, TAU), s: rnd(.5, 1.3) });
  if (K === 'meadow' || K === 'ice' || K === 'swamp') for (let i = 0; i < 5; i++) clouds.push({ x: rnd(-40, W), y: rnd(55, 175), s: rnd(.7, 1.4), v: rnd(.1, .3) });
}
function updateAmb() {
  for (const a of amb) {
    a.p += 0.03 * a.s;
    switch (ambKind) {
      case 'meadow': a.x += 0.5 * a.s + Math.sin(a.p) * .4; a.y += 0.3 * a.s + Math.cos(a.p) * .2; break;
      case 'dungeon': a.x += Math.sin(a.p * .7) * .25; a.y += Math.cos(a.p * .5) * .15 - .05; break;
      case 'ice': a.x += Math.sin(a.p) * .6 + .5; a.y += 0.9 + a.s * .8; break;
      case 'volcano': a.x += Math.sin(a.p) * .5; a.y -= 0.5 + a.s * .7; break;
      case 'swamp': a.x += Math.sin(a.p * .8) * .5; a.y += Math.cos(a.p * .6) * .35; break;
    }
    if (a.x > W + 10) a.x = -10; if (a.x < -10) a.x = W + 10;
    if (a.y > FLOOR) a.y = 0; if (a.y < -10) a.y = FLOOR;
  }
  for (const c of clouds) { c.x += c.v; if (c.x > W + 120) c.x = -140; }
}

function updateItems() {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i]; it.t++;
    if (it.vx) { it.x = clamp(it.x + it.vx, 10, W - 10); it.vx *= 0.97; }
    const prev = it.y; it.vy = Math.min(it.vy + PG * 0.6, 7); it.y += it.vy;
    if (it.y + 9 >= FLOOR) { it.y = FLOOR - 9; it.vy = 0; it.vx = 0; }
    else for (const b of blocks) if (it.vy >= 0 && prev + 9 <= b.y + 1 && it.y + 9 >= b.y && it.x > b.x && it.x < b.x + b.w) { it.y = b.y - 9; it.vy = 0; it.vx = 0; }
    if (it.t > 700) { items.splice(i, 1); continue; }
    if (Math.abs(it.x - (P.x + P.w / 2)) < 17 && Math.abs(it.y - (P.y + P.h / 2)) < 25) { pickItem(it); items.splice(i, 1); }
  }
}

function updateParts() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx; p.y += p.vy; p.r += p.grow; p.life--;
    if (p.life <= 0) parts.splice(i, 1);
  }
}

// slimes congelados são inofensivos
function playerHit() {
  if (P.inv > 0 || S.freeze > 0) return false;
  const bx = P.x + 3, by = P.y + 2, bw = P.w - 6, bh = P.h - 2;
  for (const s of slimes) {
    const cx = clamp(s.x, bx, bx + bw), cy = clamp(s.y, by, by + bh);
    const dx = s.x - cx, dy = s.y - cy;
    if (dx * dx + dy * dy < (s.r - 2) * (s.r - 2)) return true;
  }
  return false;
}

// escudo absorve 1 golpe
function hurt() {
  if (P.inv > 0 || S.state !== 'play') return;
  if (S.shield > 0) {
    S.shield = 0; P.inv = 90; sfx.shield();
    ring(P.x + P.w / 2, P.y + P.h / 2, 60, '#7cc4ff', 20, 4);
    sparks(P.x + P.w / 2, P.y + P.h / 2, '#9fd4ff', 18, 6); S.shake = 8;
    return;
  }
  killPlayer();
}

function killPlayer() {
  S.state = 'dead'; S.timer = 100; S.lives--; sfx.hit(); Music.duck(1.6); S.shake = 14;
  P.dead = { x: P.x + P.w / 2, y: P.y + 17, vx: -P.face * 2.2, vy: -7, rot: 0, dir: -P.face };
  burst(P.x + P.w / 2, P.y + P.h / 2, '#ff5555', 18); sparks(P.x + P.w / 2, P.y + P.h / 2, '#ffd0d0', 14, 6);
}

function step() {
  S.tick++;
  const wasPressed = pressed; pressed = false;
  if (S.msgT > 0) S.msgT--;
  if (S.shake > 0) S.shake--;
  if (S.fade > 0) S.fade = Math.max(0, S.fade - 0.035);
  if (S.flashA > 0) S.flashA = Math.max(0, S.flashA - 0.05);
  if (S.windSweep > 0) S.windSweep--;
  if (S.timeFlash > 0) S.timeFlash--;
  if (S.slowmo > 0) S.slowmo--;
  if (!S.paused) updateAmb();
  if (S.freeze > 0 && S.state === 'play' && !S.paused) updateWind();

  if (S.state === 'menu') { slimes.forEach(updateSlime); return; }
  if (S.state === 'shop') return;
  if (S.paused) { if (wasPressed) S.paused = false; return; }

  switch (S.state) {
    case 'ready':
      S.timer--;
      if (S.timer <= 0 || (wasPressed && S.timer < 140)) S.state = 'play';
      updateParts();
      break;
    case 'play':
      S.timeLeft--;
      if (S.timeLeft <= 0) { killPlayer(); break; }
      if (S.shield > 0) S.shield--;
      if (S.freeze > 0) S.freeze--;
      if (S.slow > 0) S.slow--;
      updatePlayer(); handleFire(); updateShots();
      if (S.state !== 'play') break;
      updateSlimes(); updateGlobs(); updateFx(); updateItems(); updateParts();
      if (playerHit()) { hurt(); if (S.state !== 'play') break; }
      if (!slimes.length) {
        S.state = 'clear'; S.timer = 200; sfx.clear();
        S.bonus = Math.floor(Math.max(0, S.timeLeft) / 60) * 10; S.score += S.bonus;
        const boss = S.cur.slimes.some(d => d.boss);
        S.gained = boss ? 40 : 10; S.coins += S.gained;
        globs = []; puddles = [];
        const last = S.level >= LEVELS.length - 1;
        S.savedLevel = last ? 0 : S.level + 1;
        S.best = Math.max(S.best, S.score); save();
      }
      break;
    case 'dead':
      S.timer--; updateParts(); updateFx(); updateGlobs();
      if (P.dead) { const d = P.dead; d.vy += 0.45; d.x += d.vx; d.y += d.vy; d.rot += 0.28 * d.dir; }
      if (S.timer <= 0) {
        if (S.lives <= 0) { S.state = 'over'; S.best = Math.max(S.best, S.score); save(); }
        else { S.weapon = 'harpoon'; startLevel(S.level); P.inv = 120; }
      }
      break;
    case 'clear':
      S.timer--; updatePlayer(); updateParts(); updateItems(); updateFx();
      P.shoot = 8;
      if (P.onGround && S.timer % 40 === 0) jumpBuf = 3;
      if (S.tick % 2 === 0) emit({ kind: 'confetti', x: rnd(0, W), y: TOP, vx: rnd(-.6, .6), vy: rnd(1, 2.2), g: .02, life: 190, r: rnd(2.5, 4), c: ['#ff6b81', '#ffd34d', '#6cf08a', '#74d7ff', '#c9a6ff'][Math.floor(rnd(0, 5))], rot: rnd(0, TAU) });
      if (S.timer <= 0 || (wasPressed && S.timer < 150)) {
        if (S.level >= LEVELS.length - 1) S.state = 'win'; else startLevel(S.level + 1);
      }
      break;
    case 'over': case 'win':
      if (wasPressed) goMenu();
      break;
  }
}

/* =====================================================================
   Loja
   ===================================================================== */
function flash(msg) { S.msg = msg; S.msgT = 120; }
function buyOrEquip(kind, item) {
  const owned = kind === 'skin' ? S.ownedSkins : S.ownedRopes;
  if (owned.includes(item.id)) { S[kind] = item.id; save(); flash(item.name + ' equipado!'); }
  else if (S.coins >= item.price) { S.coins -= item.price; owned.push(item.id); S[kind] = item.id; save(); flash(item.name + ' comprado!'); }
  else flash('Moedas insuficientes');
}
function openShop() { S.state = 'shop'; S.msg = ''; S.msgT = 0; }

/* =====================================================================
   Desenho
   ===================================================================== */
/* ===== Desenho (pixel art) ===== */
/* =====================================================================
   Pixel art: tudo é desenhado em 400x225 e ampliado sem suavização.
   1 pixel = 2 unidades lógicas (a física continua em 800x450).
   ===================================================================== */
const LW = 400, LH = 225, FL = 205;          // FL = linha do chão, em pixels
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const lctx = lo.getContext('2d'); lctx.imageSmoothingEnabled = false;
let ctx = lctx;                               // alvo atual de desenho
const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return { c, g }; };
function onto(g, fn) { const o = ctx; ctx = g; try { fn(); } finally { ctx = o; } }

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hx2 = h => (typeof h === 'string' && h[0] === '#' && h.length >= 7) ? [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)] : [255, 255, 255];
const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
function mix(a, b, t) { const A = hx2(a), B = hx2(b); return toHex(A.map((v, i) => v + (B[i] - v) * t)); }
function shade(h, amt) { return amt >= 0 ? mix(h, '#ffffff', amt) : mix(h, '#000000', -amt); }

// ---- primitivas (coordenadas em pixels) ----
function rc(x, y, w, h, c) { if (c) ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function disc(cx, cy, r, c) {
  cx = Math.round(cx); cy = Math.round(cy); r = Math.max(0, r); if (c) ctx.fillStyle = c;
  for (let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++) { const q = r * r + r * .6 - dy * dy; if (q < 0) continue; const hw = Math.floor(Math.sqrt(q)); ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
function ellip(cx, cy, rx, ry, c) {
  cx = Math.round(cx); cy = Math.round(cy); if (c) ctx.fillStyle = c; const RY = ry + .5;
  for (let dy = -Math.ceil(ry); dy <= Math.ceil(ry); dy++) { const f = 1 - (dy * dy) / (RY * RY); if (f < 0) continue; const hw = Math.floor(rx * Math.sqrt(f) + .35); ctx.fillRect(cx - hw, cy + dy, hw * 2 + 1, 1); }
}
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); if (c) ctx.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
  for (let n = 0; n < 600; n++) { ctx.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}
function ringPx(cx, cy, r, c) {
  if (c) ctx.fillStyle = c; const n = Math.max(10, Math.floor(r * 7));
  for (let i = 0; i < n; i++) { const a = i / n * TAU; ctx.fillRect(Math.round(cx + Math.cos(a) * r), Math.round(cy + Math.sin(a) * r), 1, 1); }
}
function dith(x, y, w, h, c, phase = 0) { ctx.fillStyle = c; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (((i + j + phase) & 1) === 0) ctx.fillRect(x + i, y + j, 1, 1); }

// ---- fonte bitmap 5x7 (colunas, bit0 = topo) ----
const FONT = {
  ' ': '0000000000', '!': '00005F0000', '?': '0201510906', '.': '0060600000', ',': '0050300000', ':': '0036360000', ';': '0056360000',

    if (!owned) coinPx(Math.round((x + w / 2 - 16 - String(k.price).length * 6) / 2), Math.round((y + 128) / 2));
  });
  txt('COR DA MAGIA', 40, 262, 16, '#ffffff', 'left', '#000');
  ROPES.forEach((k, i) => {
    const x = 36 + i * 122, y = 276, w = 114, h = 84, owned = S.ownedRopes.includes(k.id), eq = S.rope === k.id;
    menuBtns.push({ x, y, w, h, fn: () => buyOrEquip('rope', k) });
    const X = x / 2, Y = y / 2, Wd = w / 2, Hd = h / 2;
    panel(X, Y, Wd, Hd, eq ? '#2b7a3d' : '#3a3260', eq ? '#69db7c' : '#0c0818');
    const mx = Math.round(X + Wd / 2); ctx.globalAlpha = .35; rc(mx - 3, Y + 6, 7, 14, k.color); ctx.globalAlpha = 1; rc(mx - 1, Y + 6, 3, 14, shade(k.color, -.4));
    for (let yy = 0; yy < 14; yy++) { const ox = Math.round(Math.sin((yy * 2 + S.tick * 5) * .22) * 2); rc(mx + ox, Y + 6 + yy, 1, 1, '#fff'); rc(mx - ox, Y + 6 + yy, 1, 1, k.color); }
    disc(mx, Y + 6, 3, k.color); disc(mx, Y + 6, 2, '#fff');
    txt(k.name, x + w / 2, y + 48, 14, '#ffffff', 'center', '#000');
    txt(eq ? 'EQUIPADO' : owned ? 'USAR' : String(k.price), x + w / 2 + (owned ? 0 : 10), y + 72, 12, eq ? '#b2f2bb' : owned ? '#fff' : '#ffe27a', 'center', null);
    if (!owned) coinPx(Math.round((x + w / 2 - 16 - String(k.price).length * 6) / 2), Math.round((y + 72) / 2));
  });
  if (S.msgT > 0) txt(S.msg, W / 2, 378, 18, '#ffe27a', 'center', '#000');
  button(W / 2 - 90, H - 54, 180, 44, 'Voltar', '#5c677d', goMenu);
  txt('MOEDAS CAEM DOS SLIMES', W - 14, H - 26, 11, '#dddddd', 'right', null);
}
function drawFade() {
  if (S.flashA > 0) { ctx.fillStyle = `rgba(${S.flashC},${S.flashA})`; ctx.fillRect(0, 0, LW, LH); }
  if (S.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.round(S.fade * 6) / 6})`; ctx.fillRect(0, 0, LW, LH); }
}
function render() {
  ctx = lctx; lctx.setTransform(1, 0, 0, 1, 0, 0); lctx.clearRect(0, 0, LW, LH);
  if (S.state === 'shop') { drawShop(); drawMuteIcon(W - 38, 8); drawFade(); return; }
  drawBackground(S.state === 'menu' ? 0 : S.cur.theme);
  if (S.state === 'menu') { drawMenu(); drawMuteIcon(W - 38, 8); drawFade(); return; }
  drawBlocks(); drawItems(); drawShots(); slimes.forEach(drawSlime); drawGlobs(); drawPlayer(); drawFx(); drawParts(); drawWindOverlay(); drawHUD(); drawFade();
  if (S.paused) { overlay(); txt('PAUSADO', W / 2, H / 2, 56, '#ffffff'); txt('TOQUE / TECLA PARA CONTINUAR', W / 2, H / 2 + 50, 16, '#ffffff', 'center', '#000'); return; }
  switch (S.state) {
    case 'ready': {
      overlay(.4);
      txt(`FASE ${S.level + 1}`, W / 2, H / 2 - 66, 56, '#ffe27a', 'center', '#5a3b00');
      txt(S.cur.name, W / 2, H / 2 - 12, 28, '#ffffff');
      wrapTxt(S.cur.brief, W / 2, H / 2 + 30, 640, 14, '#ffffff', 18);
      if (S.timer < 140 && (S.tick >> 4) % 2) txt('TOQUE / ESPAÇO PARA COMEÇAR', W / 2, H / 2 + 100, 14, '#ccffee', 'center', null);
      break; }
    case 'clear':
      overlay(.4); txt('FASE COMPLETA!', W / 2, H / 2 - 30, 56, '#7dff7d', 'center', '#0b3d12');
      txt(`BÔNUS DE TEMPO: +${S.bonus} · +${S.gained} MOEDAS`, W / 2, H / 2 + 24, 16, '#ffffff'); break;
    case 'dead': if (S.timer < 70) overlay(.2); break;
    case 'over':
      overlay(.65); txt('FIM DE JOGO', W / 2, H / 2 - 30, 56, '#ff6b81', 'center', '#4a0a14');
      txt(`PONTOS: ${S.score} · RECORDE: ${S.best}`, W / 2, H / 2 + 24, 16, '#ffffff');
      txt('TOQUE / ESPAÇO PARA VOLTAR AO MENU', W / 2, H / 2 + 60, 14, '#dddddd', 'center', null); break;
    case 'win':
      overlay(.65); txt('VOCÊ VENCEU!', W / 2, H / 2 - 30, 56, '#ffe27a', 'center', '#5a3b00');
      txt(`PONTOS: ${S.score} · RECORDE: ${S.best}`, W / 2, H / 2 + 24, 16, '#ffffff');
      txt('TOQUE / ESPAÇO PARA VOLTAR AO MENU', W / 2, H / 2 + 60, 14, '#dddddd', 'center', null); break;
  }
}
function present() { // amplia o quadro pixel para a tela, sem suavização
  scr.imageSmoothingEnabled = false;
  const k = KS, sh = S.shake > 0 && S.state !== 'shop' && S.state !== 'menu' ? Math.min(3, S.shake * .3) : 0;
  const ox = sh ? Math.round(rnd(-1, 1) * sh) * k : 0, oy = sh ? Math.round(rnd(-1, 1) * sh) * k : 0;
  if (sh) { scr.fillStyle = '#000'; scr.fillRect(0, 0, cv.width, cv.height); }
  scr.drawImage(lo, ox, oy, LW * k, LH * k);
}
function draw() { render(); present(); }


/* =====================================================================
   Entrada
   ===================================================================== */
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
                 ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ' ': 'fire' };

addEventListener('keydown', e => {
  Music.unlock();
  if (KEYMAP[e.key]) { input[KEYMAP[e.key]] = true; e.preventDefault(); if (e.key === ' ' && !e.repeat) pressed = true; }
  if (e.repeat) return;
  if (KEYMAP[e.key] === 'up') jumpBuf = 8;                                  // ↑ sem escada = pulo
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Shift') { jumpBuf = 8; e.preventDefault(); }
  if (e.key === 'p' || e.key === 'P') { if (S.state === 'play') S.paused = !S.paused; }
  if (e.key === 'm' || e.key === 'M') setMuted(!S.muted);
  if (S.state === 'menu') {
    if (e.key === ' ' || e.key === 'Enter') { if (menuBtns[0]) menuBtns[0].fn(); }
    if (e.key === 'n' || e.key === 'N') newGame(0);
    if (e.key === 'l' || e.key === 'L') openShop();
  } else if (S.state === 'shop' && (e.key === 'Escape' || e.key === 'Enter')) goMenu();
  if (e.key === 'Enter') pressed = true;
});
addEventListener('keyup', e => { if (KEYMAP[e.key]) { input[KEYMAP[e.key]] = false; e.preventDefault(); } });
addEventListener('blur', () => { Object.keys(input).forEach(k => input[k] = false); if (S.state === 'play') S.paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.suspend(); else Music.unlock(); });

// toque / mouse no canvas (menus, loja e telas de texto)
cv.addEventListener('pointerdown', e => {
  Music.unlock();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (x >= muteBtn.x && x <= muteBtn.x + muteBtn.w && y >= muteBtn.y && y <= muteBtn.y + muteBtn.h) { setMuted(!S.muted); return; }
  if ((S.state === 'menu' || S.state === 'shop') && y >= 6 && y <= 40 && x >= W - 200 && x <= W - 46) { // truque de teste: toques rápidos nas moedas
    const now = performance.now(); coinTaps = coinTaps.filter(t => now - t < 1800); coinTaps.push(now);
    if (coinTaps.length >= 5) { coinTaps = []; S.coins += 99999; save(); sfx.item && sfx.item(); flash('+99999 moedas (modo teste)'); }
    return;
  }
  if (S.state === 'menu' || S.state === 'shop') {
    for (const b of menuBtns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  } else pressed = true;
});

// botões de toque
document.querySelectorAll('#ctl button').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => {
    e.preventDefault(); btn.setPointerCapture(e.pointerId); btn.classList.add('on');
    if (k === 'jump') jumpBuf = 8; else input[k] = true;
    if (k === 'up') jumpBuf = 8;
    if (k === 'fire') pressed = true;
    Music.unlock();
  };
  const off = e => { e.preventDefault(); if (k !== 'jump') input[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointercancel', off);
  btn.addEventListener('lostpointercapture', off);
});
document.addEventListener('contextmenu', e => e.preventDefault());

/* =====================================================================
   Loop (passo fixo de 60 Hz)
   ===================================================================== */
let last = 0, acc = 0;
const DT = 1000 / 60;
function frame(t) {
  requestAnimationFrame(frame);
  acc += Math.min(100, t - (last || t)) * (S.slowmo > 0 ? 0.3 : 1); last = t;
  while (acc >= DT) { step(); acc -= DT; }
  draw();
}

load(); goMenu();
requestAnimationFrame(frame);

// gancho para testes automatizados
window.__Popmancer = { startFreeze, pickItem, Music, setMuted, initAudio, getAC: () => ac, getMaster: () => master, S, P, input, LEVELS, SKINS, ROPES, BOSSES, step, draw, startLevel, newGame, goMenu, openShop, buyOrEquip, hurt, explode, popSlime, mkSlime,
  jump: () => { jumpBuf = 8; },
  get slimes() { return slimes; }, set slimes(v) { slimes = v; }, get shots() { return shots; }, get items() { return items; },
  get globs() { return globs; }, get puddles() { return puddles; }, get ladders() { return ladders; }, get blocks() { return blocks; },
  get menuBtns() { return menuBtns; } };
})();
</script>
