<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a0f08">
<title>Mixwitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
:root{
  --parch1:#f3e4b8;--parch2:#dcc185;--ink:#3b2412;--gold:#f3c85a;--gold2:#c48a1a;
  --wood1:#8a5a31;--wood2:#5e3a1c;--wood3:#2e1a0c;--cream:#f6e6bd;
  --f-title:"MedievalSharp","Cinzel",Georgia,serif;--f-ui:"Cinzel","MedievalSharp",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0704;overflow:hidden}
body{font-family:var(--f-ui);color:var(--cream);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage{position:relative;max-width:440px;height:100dvh;margin:0 auto;overflow:hidden;background:#1a0f08}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD (sobre a arte) */
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{position:absolute;pointer-events:auto}
.hit{background:transparent;border:0;padding:0;cursor:pointer;border-radius:14px}
.hit:active{background:rgba(0,0,0,.15)}
.ribbon{display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;line-height:1.05}
.ribbon .lv{white-space:nowrap;font:800 calc(46px*var(--f)) var(--f-ui);color:#ffe08a;letter-spacing:1px;text-shadow:0 calc(1px*var(--f)) 0 #fff6c8,0 calc(4px*var(--f)) 0 #3a1806,0 0 calc(14px*var(--f)) rgba(255,190,80,.55)}
.ribbon .pr{white-space:nowrap;display:flex;align-items:center;gap:calc(8px*var(--f));transform-origin:center;font:800 calc(31px*var(--f)) var(--f-ui);color:#f6e6c8;text-shadow:0 calc(2px*var(--f)) 0 #2a1406;margin-top:calc(4px*var(--f))}
.coinbox{display:flex;align-items:center;justify-content:center;pointer-events:none;font:800 calc(36px*var(--f)) var(--f-ui);color:#fbf0d8;text-shadow:0 2px 0 #1a0c04}
#coins.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.3)}}
.wbtn{flex:1;min-height:48px;padding:8px 6px;border-radius:12px;cursor:pointer;font:800 13.5px var(--f-ui);letter-spacing:.3px;color:var(--cream);text-shadow:0 1px 0 #000;
  background:linear-gradient(var(--wood1),var(--wood2));border:2px solid var(--wood3);box-shadow:inset 0 1px 0 #c28a52,0 4px 0 #1e1006}
.wbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #c28a52,0 1px 0 #1e1006}
.wbtn.gold{background:linear-gradient(#f6d26a,var(--gold2));color:#3a2600;text-shadow:0 1px 0 #ffe9a0;border-color:#6e4a05;box-shadow:inset 0 1px 0 #fff0b0,0 4px 0 #5a3d05}
.wbtn.off{opacity:.45}
.wbtn.danger{background:linear-gradient(#a13b32,#6a1d17)}
.wbtn small{font-weight:600;opacity:.8}
/* Barra inferior (botões da arte) */
.bar{position:absolute;inset:0;pointer-events:none}
.tool{position:absolute;pointer-events:auto;border:0;padding:0;cursor:pointer;background:transparent center/100% 100% no-repeat;transition:filter .15s}
.tool:active{transform:translateY(2px)}
.badge{position:absolute;display:grid;place-items:center;border-radius:50%;font:800 calc(30px*var(--f)) var(--f-ui);color:#3a2204;
  background:radial-gradient(circle at 40% 32%,#ffe9a0,#f3b928 60%,#c98a10);border:calc(4px*var(--f)) solid #3a2008;box-shadow:0 2px 3px #0007;filter:none}
.tool.off .badge{filter:grayscale(1)}
.bag,.ico{position:absolute;pointer-events:none;filter:drop-shadow(0 calc(3px*var(--f)) 0 rgba(20,6,10,.55))}
.tool{filter:drop-shadow(0 calc(6px*var(--f)) 0 rgba(18,5,16,.55)) drop-shadow(0 calc(10px*var(--f)) calc(10px*var(--f)) rgba(0,0,0,.35))}
.tool:active{filter:drop-shadow(0 calc(2px*var(--f)) 0 rgba(18,5,16,.55))}
.tool.off{filter:drop-shadow(0 calc(6px*var(--f)) 0 rgba(18,5,16,.55)) grayscale(.75) brightness(.72)}
.stage.inmenu .hud,.stage.inmenu .bar{visibility:hidden}

/* Camadas */
.layer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:18px}
.layer.on{display:flex}
.layer.dim{background:rgba(10,5,2,.72);animation:fade .2s}
.layer.menuL{background:linear-gradient(rgba(10,5,2,.25),rgba(10,5,2,.15) 35%,rgba(10,5,2,.7));align-items:stretch;flex-direction:column;justify-content:space-between;padding:7% 22px 24px}
@keyframes fade{from{opacity:0}}
.parch{width:100%;max-width:370px;max-height:90dvh;overflow:auto;padding:20px 18px 18px;color:var(--ink);border-radius:14px;position:relative;
  background:radial-gradient(120% 90% at 30% 10%,var(--parch1),var(--parch2));border:4px solid #5a3a1c;box-shadow:0 0 0 2px #c48a1a,0 24px 60px #000c,inset 0 0 30px #8a5a2a88;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}}
.parch h2{margin:0 0 6px;font:400 26px var(--f-title);text-align:center;color:#4a2a10}
.parch p{margin:6px 0 12px;font:600 13.5px/1.45 var(--f-ui);text-align:center}
.parch hr{border:0;height:2px;margin:10px 0;background:linear-gradient(90deg,transparent,#8a5a2a99,transparent)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.row{display:flex;gap:8px;margin-top:12px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed #8a5a2a88}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item b{display:block;font:800 14px var(--f-ui)}
.item .d{font:600 12px/1.3 var(--f-ui);opacity:.8}
.item .wbtn{flex:none;min-width:92px;min-height:42px;padding:6px 8px;font-size:12.5px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px;font:600 13.5px/1.4 var(--f-ui)}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f-ui);color:var(--cream);background:linear-gradient(var(--wood1),var(--wood2));border:2px solid var(--wood3)}
.stars{font-size:34px;text-align:center;color:#d99a12;text-shadow:0 2px 0 #7a5208;letter-spacing:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.sw b{font:800 14px var(--f-ui)}
.sw .d{font:600 12px var(--f-ui);opacity:.75;display:block}
.sw .wbtn{flex:none;min-width:92px;min-height:40px}

/* Menu principal */
.logo{text-align:center;margin-top:2%}
.logo .l1{font:400 52px/1 var(--f-title);color:var(--gold);letter-spacing:1px;text-shadow:0 3px 0 #6e4a05,0 6px 0 #3a2400,0 0 24px #f3c85a66}
.logo .l2{display:inline-block;margin-top:10px;padding:4px 16px;font:800 12px var(--f-ui);letter-spacing:3px;text-transform:uppercase;color:var(--cream);
  background:linear-gradient(#8e2b25,#5f1713);border:2px solid #2a0907;border-radius:6px;box-shadow:0 3px 0 #1e0706}
.mbtns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:290px;margin:0 auto}
.mbtns .wbtn{min-height:52px;font-size:16px}
.mbtns .wbtn.gold{min-height:60px;font-size:20px}
.foot{text-align:center;font:600 11px var(--f-ui);opacity:.65;margin-top:12px}

.toast{position:absolute;left:50%;bottom:calc(240px*var(--f) + 8px);transform:translate(-50%,10px);padding:9px 14px;border-radius:10px;font:800 13px var(--f-ui);color:var(--ink);
  background:var(--parch1);border:2px solid #5a3a1c;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center;z-index:5}
.toast.on{opacity:1;transform:translate(-50%,0)}
.stuck #undoBtn,.stuck #tubeBtn{animation:pul .8s infinite}@keyframes pul{50%{transform:scale(1.07);filter:brightness(1.35)}}
.pill{display:inline-flex;align-items:center;gap:calc(5px*var(--f));padding:calc(2px*var(--f)) calc(10px*var(--f));border-radius:99px;background:rgba(30,12,6,.45);box-shadow:inset 0 1px 2px #0008,0 1px 0 rgba(255,220,160,.25)}
.pill svg{width:calc(30px*var(--f));height:calc(30px*var(--f))}
</style>
</head>
<body>
<div class="stage inmenu" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud">
    <button class="hit" id="menuBtn" aria-label="Pausa"></button>
    <div class="ribbon" id="ribbon"><div class="lv" id="lv">Fase 1</div><div class="pr" id="pr">Poções 0/0</div></div>
    <div class="coinbox" id="coinbox"><span id="coins">0</span></div>
    <button class="hit" id="plusBtn" aria-label="Lojinha"></button>
  </div>
  <div class="bar" id="bar">
    <button class="tool" id="undoBtn" aria-label="Voltar"><svg class="ico" viewBox="0 0 24 24"><path d="M9.5 4.5L4 10l5.5 5.5" fill="none" stroke="#2a1208" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10H14a5.2 5.2 0 010 10.4H9" fill="none" stroke="#2a1208" stroke-width="5" stroke-linecap="round"/><path d="M9.5 4.5L4 10l5.5 5.5" fill="none" stroke="#fff3d6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10H14a5.2 5.2 0 010 10.4H9" fill="none" stroke="#fff3d6" stroke-width="2.6" stroke-linecap="round"/></svg><b class="badge" id="undoN">3</b></button>
    <button class="tool" id="hintBtn" aria-label="Dica"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="9.5" r="9" fill="#ffd95a" opacity=".28"/><path d="M12 2.6a6.4 6.4 0 00-3.6 11.7c.5.4.7.8.7 1.3v1.6h5.8v-1.6c0-.5.2-.9.7-1.3A6.4 6.4 0 0012 2.6z" fill="#ffe27a" stroke="#2a1208" stroke-width="1.5"/><path d="M10.2 6.2a3.2 3.2 0 00-2 2.6" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="9" y="18" width="6" height="2.2" rx="1" fill="#e9dcc0" stroke="#2a1208" stroke-width="1.1"/><rect x="10" y="20.9" width="4" height="1.8" rx=".9" fill="#e9dcc0" stroke="#2a1208" stroke-width="1.1"/></svg><b class="badge" id="hintN">3</b></button>
    <button class="tool" id="tubeBtn" aria-label="Frasco"><svg class="ico" viewBox="0 0 24 24"><path d="M9.3 2.4h5.4M10 2.6v5.6l-5.2 8.7A3 3 0 007.4 21.4h9.2a3 3 0 002.6-4.5L14 8.2V2.6" fill="#e9f4ff" fill-opacity=".85" stroke="#2a1208" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.6 15h10.8l1.8 3a2 2 0 01-1.7 2.9H6.5A2 2 0 014.8 18z" fill="#57e36a"/><path d="M12 10.6v5.6M9.2 13.4h5.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M12 10.6v5.6M9.2 13.4h5.6" stroke="#1f7a2c" stroke-width="1" stroke-linecap="round"/></svg><b class="badge" id="tubeN">2</b></button>
    <button class="tool" id="shopBtn" aria-label="Lojinha"><svg class="bag" viewBox="0 0 24 24" fill="#3a2410"><path d="M5.5 8.5h13l1.2 12.5H4.3z"/><path d="M8.8 8.5V7a3.2 3.2 0 016.4 0v1.5" fill="none" stroke="#3a2410" stroke-width="2.2"/><circle cx="9" cy="11.5" r="1.1" fill="#f6c94a"/><circle cx="15" cy="11.5" r="1.1" fill="#f6c94a"/></svg></button>
  </div>
  <div class="layer" id="layer"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
'use strict';

/* ======================= CONFIG ======================= */
const GAME_NAME = 'Mixwitch';
const GAME_SUB = 'Taverna da Bruxa';
const CAP = 4, LW = 360;
const PALETTE = [
  {n:'Rubi',     c:'#f2203a'}, {n:'Âmbar',    c:'#ff8a12'}, {n:'Sol',     c:'#ffd60a'}, {n:'Musgo',  c:'#35d63a'},
  {n:'Noite',    c:'#2b2140'}, {n:'Safira',   c:'#1670ff'}, {n:'Ametista',c:'#9a34ff'}, {n:'Rosa',   c:'#ff4fb6'},
  {n:'Terra',    c:'#9b4a16'}, {n:'Névoa',    c:'#f2eeff'}
];
const PHRASES = ['Hihihi!', 'Borbulha, borbulha!', 'Mais uma poção!', 'Que cheirinho!', 'Perfeito!', 'Abracadabra!', 'A casa paga!'];

/* ======================= SAVE ======================= */
const SAVE_KEY = 'brewmancer-v1';
let save = {coins:0, level:1, undo:3, hint:3, tubes:2, up:{cauldron:0, luck:0, extra:0}, opt:{sound:true}};
try {
  let raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem('pocoes-da-bruxa-v1');
  const s = JSON.parse(raw || 'null');
  if (s && typeof s === 'object') save = {...save, ...s, up:{...save.up, ...(s.up || {})}, opt:{...save.opt, ...(s.opt || {})}};
} catch (e) {}
function persist(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ======================= UTIL ======================= */
const $ = s => document.querySelector(s);
const rand = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rr(c, x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ======================= SOM ======================= */
const Snd = {
  ctx: null,
  init(){ if (!save.opt.sound) return; try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  tone(f, d, type, v, slide, delay){
    const a = this.ctx; if (!a || !save.opt.sound) return;
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || .1, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
  },
  sel(){ this.tone(560, .07, 'triangle', .08); },
  bad(){ this.tone(150, .14, 'sawtooth', .05, .7); },
  pour(){ for (let i = 0; i < 8; i++) this.tone(260 + Math.random() * 280, .09, 'sine', .07, 1.7, i * .055); },
  coin(){ this.tone(988, .08, 'square', .04); this.tone(1319, .16, 'square', .04, 1, .07); },
  splash(){ this.tone(240, .28, 'sine', .12, .35); this.tone(420, .18, 'triangle', .06, .5, .03); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .24, 'triangle', .1, 1, i * .12)); }
};

/* ======================= SOLVER / GERADOR ======================= */
let solveAborted = false;
function solve(start, wantPath, limit){
  let nodes = 0, aborted = false; limit = limit || 25000;
  const seen = new Set(), path = [];
  const key = t => t.map(x => x.join(',')).sort().join('|');
  const done = t => t.every(x => x.length === 0 || (x.length === CAP && x.every(c => c === x[0])));
  function dfs(t){
    if (done(t)) return true;
    const k = key(t);
    if (seen.has(k)) return false;
    seen.add(k);
    if (++nodes > limit){ aborted = true; return false; }
    const moves = [];
    for (let i = 0; i < t.length; i++){
      const a = t[i];
      if (!a.length) continue;
      const top = a[a.length - 1];
      let run = 0;
      for (let q = a.length - 1; q >= 0 && a[q] === top; q--) run++;
      const uniform = run === a.length;
      if (uniform && a.length === CAP) continue;
      for (let j = 0; j < t.length; j++){
        if (i === j) continue;
        const b = t[j];
        if (b.length >= CAP) continue;
        if (b.length === 0){ if (uniform) continue; moves.push([1, i, j]); }
        else if (b[b.length - 1] === top) moves.push([0, i, j]);
      }
    }
    moves.sort((x, y) => x[0] - y[0]);
    for (const m of moves){
      const n = t.map(x => x.slice());
      const a = n[m[1]], b = n[m[2]];
      const top = a[a.length - 1];
      while (a.length && a[a.length - 1] === top && b.length < CAP) b.push(a.pop());
      path.push([m[1], m[2]]);
      if (dfs(n)) return true;
      path.pop();
      if (aborted) return false;
    }
    return false;
  }
  const r = dfs(start); solveAborted = aborted;
  if (wantPath) return r ? path : null;
  return r ? true : (aborted ? null : false);
}
function genLevel(level){
  const nColors = Math.min(10, 3 + Math.floor(level / 1.5));
  const empties = 2 + save.up.extra;
  let unknown = null, last = null;
  for (let a = 0; a < 14; a++){
    const ids = shuffle([...PALETTE.keys()]).slice(0, nColors);
    const pool = [];
    ids.forEach(id => { for (let i = 0; i < CAP; i++) pool.push(id); });
    shuffle(pool);
    const t = [];
    for (let i = 0; i < nColors; i++) t.push(pool.slice(i * CAP, (i + 1) * CAP));
    for (let i = 0; i < empties; i++) t.push([]);
    last = t;
    if (t.some(x => x.length === CAP && x.every(c => c === x[0]))) continue;
    const r = solve(t);
    if (r === true) return t;
    if (r === null) unknown = t;
  }
  return unknown || last;
}

/* ======================= ESTADO DO JOGO ======================= */
let tubes = [], initial = '[]', selected = -1, history = [];
let busy = false, cleared = false, uiOpen = true;
let stuckT = -9, moveCount = 0, parMoves = 1, saleInfo = null, levelCoins = 0, totalPotions = 0, sentPotions = 0, pendingFlights = 0;
let pour = null, sale = null, lastColor = 3, lastSale = 0, hint = null, addedTubes = 0;
const flights = [], parts = [], texts = [];
let lift = [];
let TT = 0;

/* ======================= CANVAS ======================= */
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, sc = 1, Hl = 640, topR = 58, botR = 76, sh = 170, sceneB = 228, u = 1;
let bgL, fgL, vigL;

function resize(){
  const r = stage.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  dpr = Math.min(2.5, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  sc = W / LW; Hl = H / sc;
  topR = 125 * IS; botR = 225 * IS;
  sceneB = 665 * IS; sh = sceneB - topR; u = 1;

}
function placeUI(){

  };

function updatePour(){

}

/* ======================= LÓGICA ======================= */
function startLevel(){
  cleared = false; selected = -1; history = []; busy = false; pour = null; sale = null; hint = null; addedTubes = 0; levelCoins = 0; moveCount = 0; sentPotions = 0; pendingFlights = 0;
  flights.length = 0;
  tubes = genLevel(save.level); initial = JSON.stringify(tubes); lift = tubes.map(() => 0);
  totalPotions = tubes.filter(t => t.length).length;
  const pth = solve(tubes.map(x => x.slice()), true); parMoves = Math.max(totalPotions, pth ? Math.ceil(pth.length * .7) : totalPotions * 2);
  layoutBoard(); updateHud();
}
function restartLevel(){
  if (busy || cleared) return;
  tubes = JSON.parse(initial); selected = -1; history = []; hint = null; addedTubes = 0; moveCount = 0; sentPotions = 0; flights.length = 0; pendingFlights = 0;
  totalPotions = tubes.filter(t => t.length).length; lift = tubes.map(() => 0);
  layoutBoard(); updateHud();
}
function canPour(a, b){
  const A = tubes[a], B = tubes[b];
  if (!A.length || B.length >= CAP) return false;
  return B.length === 0 || B[B.length - 1] === A[A.length - 1];
}
function onTap(x, y){
  if (sale && !uiOpen){ sale.t0 = Math.min(sale.t0, TT - 4.8); return; }
  if (uiOpen || busy || cleared) return;
  hint = null;
  if (y < sceneB && x < 112 && y > sceneB - 120){ say.txt = rand(PHRASES); say.t = 1.8; return; }
  let hit = -1;
  for (let i = 0; i < tubes.length; i++){
    const p = pos[i]; if (!p) continue;
    if (Math.abs(x - p.x) <= (BW + 6) * bs && y >= p.by - (TOTAL_H + 20) * bs && y <= p.by + 10){ hit = i; break; }
  }
  if (hit < 0){ if (selected !== -1){ selected = -1; } return; }
  if (selected === -1){ if (tubes[hit].length){ selected = hit; Snd.sel(); } else Snd.bad(); return; }
  if (selected === hit){ selected = -1; Snd.sel(); return; }
  if (canPour(selected, hit)) startPour(selected, hit);
  else if (tubes[hit].length){ selected = hit; Snd.sel(); }
  else Snd.bad();
}
function startPour(a, b){
  busy = true; hint = null; moveCount++;
  const A = tubes[a], top = A[A.length - 1];
  let run = 0; for (let q = A.length - 1; q >= 0 && A[q] === top; q--) run++;
  const m = Math.min(run, CAP - tubes[b].length);
  pour = {a, b, m, color: top, t0: TT, dur: 1.15, pp: 0, applied: false, stream: false, sfx: false, dir: pos[b].x >= pos[a].x ? 1 : -1, x: pos[a].x, y: pos[a].by - MID * bs, rot: 0};
  selected = -1;
}
function applyPour(){
  const P = pour; history.push(JSON.stringify(tubes)); if (history.length > 60) history.shift();
  const A = tubes[P.a], B = tubes[P.b];
  for (let k = 0; k < P.m; k++) B.push(A.pop());
  P.applied = true;
  checkTubes();
}
function checkTubes(){
  const done = [];
  tubes.forEach((t, i) => { if (t.length === CAP && t.every(c => c === t[0])) done.push(i); });
  if (!done.length) return;
  const g = cauldronGeo();
  done.forEach((i, k) => {
    const p = pos[i], c = tubes[i][0]; tubes[i] = [];
    flights.push({c, x0: p.x, y0: p.by - MID * bs, tx: g.mouthX, ty: g.mouthY, s: bs, t0: TT + k * .22, dur: .95});
    pendingFlights++; sentPotions++;
    setTimeout(() => { throwT = 0; }, k * 220);
  });
  history = [];
}
function landing(f){
  const g = cauldronGeo(); lastColor = f.c;
  brewTarget = hex(PALETTE[f.c].c); ripple = 1;
  sparks(g.mouthX, g.mouthY, PALETTE[f.c].c, 22, 80); Snd.splash();
  say.txt = rand(PHRASES); say.t = 1.8;
  pendingFlights--; updateHud();
  if (pendingFlights === 0 && tubes.every(t => !t.length)) levelClear();
}
function undo(){
  if (uiOpen || busy || cleared) return;
  if (!history.length){ toast('Nada para voltar agora.'); return; }
  if (save.undo <= 0){ toast('Sem voltas! Veja a lojinha.'); return; }
  tubes = JSON.parse(history.pop()); lift = tubes.map(() => 0); save.undo--; selected = -1; hint = null; persist(); updateHud(); Snd.sel();
}
function anyMove(){
  for (let a = 0; a < tubes.length; a++){
    if (!tubes[a].length) continue;
    for (let b = 0; b < tubes.length; b++){
      if (a !== b && canPour(a, b)){
        const A = tubes[a], B = tubes[b], uni = A.every(c => c === A[0]);
        if (!B.length && uni) continue;
        return true;
      }
    }
  }
  return false;
}
function findHint(){
  const path = solve(tubes.map(x => x.slice()), true, 150000);
  if (path && path.length) return {mv: path[0]};
  if (path) return null;
  if (solveAborted){
    for (let a = 0; a < tubes.length; a++){
      if (!tubes[a].length) continue;
      for (let b = 0; b < tubes.length; b++){
        if (a !== b && tubes[b].length && canPour(a, b)) return {mv: [a, b]};
      }
    }
  }
  return {stuck: true};
}
function useHint(){
  if (uiOpen || busy || cleared) return;
  if (save.hint <= 0){ toast('Sem dicas! Veja a lojinha.'); return; }
  const r = findHint();
  if (!r || r.stuck){ toast('Sem saída por aqui! Use Voltar ou um Frasco extra (a dica não foi gasta).'); stuckT = TT; return; }
  save.hint--; persist(); selected = -1; hint = {a: r.mv[0], b: r.mv[1], t0: TT}; updateHud(); Snd.sel();
}
function useTube(){
  if (uiOpen || busy || cleared) return;
  if (addedTubes >= 2){ toast('Máximo de 2 frascos extras por fase.'); return; }
  if (save.tubes <= 0){ toast('Sem frascos mágicos! Veja a lojinha.'); return; }
  if (tubes.length >= 14){ toast('A mesa está cheia!'); return; }
  save.tubes--; addedTubes++; persist();
  tubes.push([]); lift.push(0);
  history = history.map(h => { const a = JSON.parse(h); a.push([]); return JSON.stringify(a); });
  selected = -1; hint = null; layoutBoard(); updateHud(); Snd.splash();
  const p = pos[tubes.length - 1]; if (p) sparks(p.x, p.by - 60 * bs, '#bff3ff', 18, 70);
}
function fitHud(){
  const pr = $('#pr'), rb = $('#ribbon'); pr.style.transform = ''; const k = Math.min(1, (rb.clientWidth - 4) / Math.max(1, pr.scrollWidth)); pr.style.transform = 'scale(' + k + ')';
}
function updateHud(){
  document.body.classList.toggle('stuck', TT - stuckT < 6);
  $('#lv').textContent = 'Fase ' + save.level;
  $('#pr').innerHTML = '<span class="pill" title="Poções"><svg viewBox="0 0 24 24"><path d="M9.5 2.5h5M10.3 2.8v4.4a8 8 0 103.4 0V2.8" fill="#c79cff" stroke="#2a1208" stroke-width="1.6"/><path d="M5.2 14a6.8 6.8 0 0013.6 0z" fill="#b051ff"/></svg>' + sentPotions + '/' + totalPotions + '</span><span class="pill" title="Jogadas"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3" fill="none" stroke="#ffd56a" stroke-width="2.6" stroke-linecap="round"/><path d="M18.6 3v4.2h-4.2M5.4 21v-4.2h4.2" fill="none" stroke="#ffd56a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' + moveCount + '</span>'; fitHud();
  $('#coins').textContent = save.coins;
  $('#undoN').textContent = save.undo; $('#hintN').textContent = save.hint; $('#tubeN').textContent = save.tubes;
  $('#undoBtn').classList.toggle('off', !history.length || save.undo <= 0);
  $('#hintBtn').classList.toggle('off', save.hint <= 0);
  $('#tubeBtn').classList.toggle('off', save.tubes <= 0 || addedTubes >= 2);
}
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1900);
}

/* ======================= LOJINHA ======================= */
const SHOP = [
  {id:'cauldron', name:'Caldeirão Fervente', desc:'+25% de moedas na venda', max:8, cost:l => Math.round(40 * Math.pow(1.6, l))},
  {id:'luck', name:'Trevo da Bruxa', desc:'+15% de chance de moedas em dobro', max:5, cost:l => Math.round(70 * Math.pow(1.8, l))},
  {id:'extra', name:'Frasco de Reserva', desc:'+1 frasco vazio em toda fase nova', max:2, cost:l => [150, 500][l]},
  {id:'undo', name:'Pergaminho de Voltar', desc:'+3 usos para voltar 1 passo', consumable:true, cost:() => 40, have:() => save.undo, give:() => { save.undo += 3; }},
  {id:'hint', name:'Cristal de Dica', desc:'+3 dicas de jogada', consumable:true, cost:() => 50, have:() => save.hint, give:() => { save.hint += 3; }},
  {id:'tube', name:'Frasco Mágico', desc:'+2 frascos extras para usar na fase', consumable:true, cost:() => 60, have:() => save.tubes, give:() => { save.tubes += 2; }}
];

/* ======================= TELAS (DOM) ======================= */
const layer = $('#layer');
function showLayer(html, cls){ layer.className = 'layer on ' + (cls || 'dim'); layer.innerHTML = html; uiOpen = true; }
function hideLayer(){ layer.className = 'layer'; layer.innerHTML = ''; uiOpen = false; }
const onOff = v => v ? 'Ligado' : 'Desligado';

function showMenu(){
  stage.classList.add('inmenu'); selected = -1;
  showLayer(
    '<div class="logo"><div class="l1">' + GAME_NAME + '</div><div class="l2">' + GAME_SUB + '</div></div>' +
    '<div><div class="mbtns">' +
      '<button class="wbtn gold" data-act="play">Jogar &middot; Fase ' + save.level + '</button>' +
      '<button class="wbtn" data-act="shop" data-arg="menu">Lojinha</button>' +
      '<button class="wbtn" data-act="options" data-arg="menu">Opções</button>' +
      '<button class="wbtn" data-act="how" data-arg="menu">Como jogar</button>' +
    '</div><div class="foot">&#9733; ' + save.coins + ' moedas guardadas</div></div>', 'menuL');
}
function showPause(){
  showLayer('<div class="parch"><h2>Pausa</h2><div class="stack">' +
    '<button class="wbtn gold" data-act="resume">Continuar</button>' +
    '<button class="wbtn" data-act="restart">Reiniciar fase</button>' +
    '<button class="wbtn" data-act="shop" data-arg="pause">Lojinha</button>' +
    '<button class="wbtn" data-act="options" data-arg="pause">Opções</button>' +
    '<button class="wbtn danger" data-act="menu">Menu principal</button></div></div>');
}
function showOptions(from){
  showLayer('<div class="parch"><h2>Opções</h2>' +
    '<div class="sw"><div><b>Som</b><span class="d">Efeitos sonoros</span></div><button class="wbtn ' + (save.opt.sound ? 'gold' : '') + '" data-act="tog" data-arg="sound|' + from + '">' + onOff(save.opt.sound) + '</button></div><hr>' +
    '<div class="sw"><div><b>Apagar progresso</b><span class="d">Fase, moedas e melhorias</span></div><button class="wbtn danger" data-act="reset" data-arg="' + from + '">Apagar</button></div>' +
    '<div class="row"><button class="wbtn" data-act="back" data-arg="' + from + '">Voltar</button></div></div>');
}
function showHow(from){
  showLayer('<div class="parch"><h2>Como jogar</h2><ol class="steps">' +
    '<li>Toque num frasco e depois em outro para despejar a poção.</li>' +
    '<li>Só dá para despejar em frasco vazio ou com a mesma cor por cima.</li>' +
    '<li>Frasco com 4 poções iguais vai para o caldeirão e rende moedas.</li>' +
    '<li>Travou? Use <b>Voltar</b> (desfaz 1 jogada), <b>Dica</b> (mostra uma jogada) ou <b>Frasco</b> (um frasco vazio extra).</li>' +
    '<li>Ao terminar, a bruxa vende uma poção a um cliente. Quanto menos jogadas, mais moedas! Gaste na lojinha.</li></ol>' +
    '<div class="row"><button class="wbtn" data-act="back" data-arg="' + from + '">Voltar</button></div></div>');
}
function showShop(from){
  let h = '<div class="parch"><h2>Lojinha</h2><p>Você tem <b>' + save.coins + '</b> moedas.</p>';
  SHOP.forEach(it => {
    const lvl = it.consumable ? 0 : save.up[it.id], maxed = !it.consumable && lvl >= it.max, cost = maxed ? 0 : it.cost(lvl);
    const status = it.consumable ? 'Você tem ' + it.have() : 'Nível ' + lvl + '/' + it.max;
    h += '<div class="item"><div class="t"><b>' + it.name + '</b><span class="d">' + it.desc + ' &middot; ' + status + '</span></div>' +
      '<button class="wbtn ' + (maxed || save.coins < cost ? 'off' : 'gold') + '" data-act="buy" data-arg="' + it.id + '|' + from + '">' + (maxed ? 'Máximo' : cost + ' moedas') + '</button></div>';
  });
  h += '<div class="row"><button class="wbtn" data-act="back" data-arg="' + from + '">Voltar</button></div></div>';
  showLayer(h);
}
function showClear(){
  showLayer('<div class="parch"><div class="stars">' + '&#9733;'.repeat(saleInfo.stars) + '<span style="opacity:.25">' + '&#9733;'.repeat(3 - saleInfo.stars) + '</span></div><h2>Fase concluída!</h2>' +
    '<p>Poção vendida por <b>+' + lastSale + '</b> moedas' + (saleInfo.lucky ? ' (sorte em dobro!)' : '') + '.<br>Jogadas: <b>' + saleInfo.moves + '</b> &middot; Ideal: <b>' + saleInfo.par + '</b><br><span class="d">Menos jogadas = mais moedas</span></p>' +
    '<div class="row"><button class="wbtn" data-act="shop" data-arg="clear">Lojinha</button><button class="wbtn gold" data-act="next">Próxima fase</button></div></div>');
}
function levelClear(){
  cleared = true; save.level++; persist(); updateHud();
  const g = cauldronGeo(); sparks(g.mouthX, g.mouthY, '#f3c85a', 40, 110); Snd.win();
  say.txt = 'Hora de vender!'; say.t = 2;
  startSale();
}
function goBack(from){
  if (from === 'menu') showMenu(); else if (from === 'pause') showPause(); else if (from === 'clear') showClear(); else hideLayer();
}
function act(a, arg){
  const parts2 = (arg || '').split('|');
  switch (a){
    case 'play': hideLayer(); stage.classList.remove('inmenu'); if (cleared && !sale) startLevel(); break;
    case 'resume': hideLayer(); break;
    case 'restart': hideLayer(); restartLevel(); break;
    case 'menu': showMenu(); break;
    case 'options': showOptions(arg); break;
    case 'how': showHow(arg); break;
    case 'shop': showShop(arg); break;
    case 'back': goBack(arg); break;
    case 'next': hideLayer(); startLevel(); break;
    case 'tog': save.opt[parts2[0]] = !save.opt[parts2[0]]; persist(); if (parts2[0] === 'sound') Snd.init(); showOptions(parts2[1]); break;
    case 'buy': {
      const it = SHOP.find(s => s.id === parts2[0]);
      const lvl = it.consumable ? 0 : save.up[it.id];
      if (!it.consumable && lvl >= it.max) break;
      const cost = it.cost(lvl);
      if (save.coins < cost){ toast('Moedas insuficientes.'); break; }
      save.coins -= cost; if (it.consumable) it.give(); else save.up[it.id]++;
      persist(); updateHud(); showShop(parts2[1]); Snd.coin(); break;
    }
    case 'reset':
      showLayer('<div class="parch"><h2>Apagar tudo?</h2><p>Fase, moedas e melhorias voltam ao começo. Isso não pode ser desfeito.</p>' +
        '<div class="row"><button class="wbtn" data-act="back" data-arg="' + arg + '">Cancelar</button><button class="wbtn danger" data-act="resetyes">Apagar</button></div></div>');
      break;
    case 'resetyes':
      save = {coins:0, level:1, undo:3, hint:3, tubes:2, up:{cauldron:0, luck:0, extra:0}, opt:save.opt}; persist(); startLevel(); showMenu(); break;
  }
}
layer.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  Snd.init(); if (b.dataset.act !== 'buy') Snd.sel();
  act(b.dataset.act, b.dataset.arg);
});
$('#menuBtn').onclick = () => { Snd.init(); if (!busy) showPause(); };
$('#undoBtn').onclick = () => { Snd.init(); undo(); };
$('#hintBtn').onclick = () => { Snd.init(); useHint(); };
$('#tubeBtn').onclick = () => { Snd.init(); useTube(); };
$('#plusBtn').onclick = () => { Snd.init(); if (!busy && !cleared) showShop('game'); };
$('#shopBtn').onclick = () => { Snd.init(); if (!busy && !cleared) showShop('game'); };

cv.addEventListener('pointerdown', e => {
  Snd.init();
  const r = cv.getBoundingClientRect();
  onTap((e.clientX - r.left) / sc, (e.clientY - r.top) / sc);
});

/* ======================= LOOP ======================= */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
startLevel();
showMenu();
requestAnimationFrame(frame);
try { if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('17px "MedievalSharp"'), document.fonts.load('800 12px "Cinzel"')]).then(buildLayers).catch(() => {}); } catch (e) {}
window.__brew = {get tubes(){ return tubes; }, setT(t){ tubes = t; lift = t.map(() => 0); layoutBoard(); }, act, startLevel, onTap, useHint, useTube, get pos(){ return pos; }, dbgSale(t, st){ cleared = true; startSale(); sale.type = t; sale.t0 = TT - st; }, get state(){ return {busy, cleared, pendingFlights, sentPotions, totalPotions, save}; }};
})();
</script>
