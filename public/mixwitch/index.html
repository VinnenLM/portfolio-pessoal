<style>
:root{
  --parch1:#f3e4b8;--parch2:#dcc185;--ink:#3b2412;--gold:#f3c85a;--gold2:#c48a1a;
  --wood1:#8a5a31;--wood2:#5e3a1c;--wood3:#2e1a0c;--cream:#f6e6bd;
  --f-title:"MedievalSharp","Cinzel",Georgia,serif;--f-ui:"Cinzel","MedievalSharp",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d0704;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--f-ui);color:var(--cream);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage{position:relative;--sw:min(100vw,600px,calc(100dvh*.58));width:var(--sw);height:min(100dvh,calc(var(--sw)/.44));overflow:hidden;background:#1a0f08;flex:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* HUD (sobre a arte) */
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{position:absolute;pointer-events:auto}
.hit{background:transparent;border:0;padding:0;cursor:pointer;border-radius:14px}
.hit:active{background:rgba(0,0,0,.15)}
.ribbon{display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;line-height:1.05}
.ribbon .lv{white-space:nowrap;font:800 calc(46px*var(--f)) var(--f-ui);color:#ffe08a;letter-spacing:1px;text-shadow:0 calc(1px*var(--f)) 0 #fff6c8,0 calc(4px*var(--f)) 0 #3a1806,0 0 calc(14px*var(--f)) rgba(255,190,80,.55)}
.ribbon .pr{white-space:nowrap;display:flex;align-items:center;gap:calc(8px*var(--f));transform-origin:center;font:800 calc(31px*var(--f)) var(--f-ui);color:#f6e6c8;text-shadow:0 calc(2px*var(--f)) 0 #2a1406;margin-top:calc(4px*var(--f))}
.coinbox{display:flex;align-items:center;justify-content:center;pointer-events:none;font:800 calc(36px*var(--f)) var(--f-ui);color:#fbf0d8;text-shadow:0 2px 0 #1a0c04}
#coins.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.3)}}
.wbtn{flex:1;min-height:48px;padding:8px 6px;border-radius:12px;cursor:pointer;font:800 13.5px var(--f-ui);letter-spacing:.3px;color:var(--cream);text-shadow:0 1px 0 #000;
  background:linear-gradient(var(--wood1),var(--wood2));border:2px solid var(--wood3);box-shadow:inset 0 1px 0 #c28a52,0 4px 0 #1e1006}
.wbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #c28a52,0 1px 0 #1e1006}

const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h){ if (h[0] !== '#'){ const m = h.match(/[\d.]+/g); return [+m[0], +m[1], +m[2]]; } return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rr(c, x, y, w, h, r){ r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

const Snd = {
  ctx: null, sfx: null, mus: null, noiseBuf: null, musOn: false, nextT: 0, step: 0, timer: null,
  init(){
    if (!save.opt.sound && !save.opt.music) return;
    try {
      if (!this.ctx){
        const a = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.sfx = a.createGain(); this.sfx.gain.value = 1; this.sfx.connect(a.destination);
        this.mus = a.createGain(); this.mus.gain.value = .0001; this.mus.connect(a.destination);
        const n = a.sampleRate, b = a.createBuffer(1, n, n), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; this.noiseBuf = b;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
    this.music(save.opt.music);
  },
  tone(f, d, type, v, slide, delay, dest){
    const a = this.ctx; if (!a) return;
    if (!dest && !save.opt.sound) return;
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || .1, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + d + .03);
  },
  noise(t, d, f0, f1, q, v, dest){
    const a = this.ctx, src = a.createBufferSource(), bp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = this.noiseBuf; bp.type = 'bandpass'; bp.Q.value = q; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .04); g.gain.setValueAtTime(v, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    src.connect(bp); bp.connect(g); g.connect(dest || this.sfx); src.start(t, Math.random() * .5); src.stop(t + d + .05);
  },
  sel(){ this.tone(560, .07, 'triangle', .08); },
  bad(){ this.tone(150, .14, 'sawtooth', .05, .7); },
  pour(){
    const a = this.ctx; if (!a || !save.opt.sound) return;
    if (PUG()){ for (let i = 0; i < 16; i++) this.noise(a.currentTime + i * .04 + Math.random() * .02, .035, 2400 + Math.random() * 2200, 1500, 4, .08 + Math.random() * .05); return; }
    for (let i = 0; i < 8; i++) this.tone(260 + Math.random() * 280, .09, 'sine', .07, 1.7, i * .055);
  },
  // borbulho no caldeirão
  bubble(){
    const a = this.ctx; if (!a || !save.opt.sound) return;
    if (PUG()){ this.tone(110, .16, 'sine', .2, .6); for (let i = 0; i < 18; i++) this.noise(a.currentTime + .02 + i * .035 + Math.random() * .02, .04, 1800 + Math.random() * 2600, 1200, 3, .07 + Math.random() * .06); return; }
    this.tone(150, .35, 'sine', .16, .45); this.noise(a.currentTime, .25, 300, 120, 1, .12);
    for (let i = 0; i < 9; i++){ const f = 260 + Math.random() * 380; this.tone(f, .06 + Math.random() * .05, 'sine', .07 + Math.random() * .05, 2.4, .08 + i * .07 + Math.random() * .05); }
  },
  coin(){ this.tone(988, .08, 'square', .04); this.tone(1319, .16, 'square', .04, 1, .07); },
  splash(){ this.bubble(); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .24, 'triangle', .1, 1, i * .12)); },
  /* ---- música de taverna (Ré dórico, 6/8) gerada por código ---- */
  music(on){
    const a = this.ctx; if (!a) return;
    on = on && !document.hidden;
    if (on && !this.musOn){
      this.musOn = true; this.nextT = a.currentTime + .1;
      this.mus.gain.cancelScheduledValues(a.currentTime); this.mus.gain.setTargetAtTime(.55, a.currentTime, .6);
      if (!this.timer) this.timer = setInterval(() => this.sched(), 120);
    } else if (!on && this.musOn){
      this.musOn = false; this.mus.gain.cancelScheduledValues(a.currentTime); this.mus.gain.setTargetAtTime(.0001, a.currentTime, .15);
    }
  },
  pluck(f, t, v, d){
    const a = this.ctx, o = a.createOscillator(), o2 = a.createOscillator(), lp = a.createBiquadFilter(), g = a.createGain();
    o.type = 'triangle'; o2.type = 'sawtooth'; o.frequency.value = f; o2.frequency.value = f * 1.002;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(f * 6, t); lp.frequency.exponentialRampToValueAtTime(f * 1.2, t + d);
    const g2 = a.createGain(); g2.gain.value = .25; o2.connect(g2); g2.connect(lp); o.connect(lp);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    lp.connect(g); g.connect(this.mus); o.start(t); o2.start(t); o.stop(t + d + .05); o2.stop(t + d + .05);
  },
  flute(f, t, d, v){
    const a = this.ctx, o = a.createOscillator(), lfo = a.createOscillator(), lg = a.createGain(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = f; lfo.frequency.value = 5.2; lg.gain.value = f * .006; lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .06); g.gain.setValueAtTime(v * .85, t + d * .7); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.mus); o.start(t); lfo.start(t); o.stop(t + d + .05); lfo.stop(t + d + .05);
  },
  drum(t, v, f){ this.tone(f || 110, .18, 'sine', v, .45, t - this.ctx.currentTime, this.mus); this.noise(t, .06, 2500, 1500, .8, v * .25, this.mus); },
  sched(){
    if (!this.musOn) return;
    const a = this.ctx, E = .21; // colcheia
    const N = n => 146.83 * Math.pow(2, n / 12); // semitons a partir de Ré3
    const CH = [[0, 3, 7], [-2, 2, 5], [-5, -1, 2], [0, 3, 7], [0, 3, 7], [-2, 2, 5], [-5, -2, 2], [-5, -1, 2]]; // Dm C G Dm | Dm C Gm G
    const MEL = [
      [12, -1, 10, 7, -1, 5], [3, -1, 5, 7, -1, 10], [9, -1, 7, 5, 3, 2], [0, -1, -1, -1, -1, -1],
      [12, -1, 15, 14, -1, 12], [10, -1, 7, 9, -1, 10], [7, -1, 5, 3, -1, 2], [0, -1, -1, 2, -1, -1]
    ];
    while (this.nextT < a.currentTime + .6){
      const t = this.nextT, bar = Math.floor(this.step / 6) % 8, b = this.step % 6, ch = CH[bar], cyc = Math.floor(this.step / 48) % 2;
      if (b === 0){ this.pluck(N(ch[0] - 12), t, .09, 1.1); this.drum(t, .12, 95); }
      if (b === 3) this.drum(t, .07, 120);
      const arp = [0, 1, 2, 1, 2, 1][b]; this.pluck(N(ch[arp]), t, .045, .4);
      const m = MEL[bar][b];
      if (cyc === 1 && m >= 0){ let len = 1; while (b + len < 6 && MEL[bar][b + len] === -1) len++; this.flute(N(m + 12), t, len * E * .95, .045); }
      if (cyc === 0 && m >= 0 && b % 3 === 0) this.pluck(N(m + 12), t, .035, .5);
      this.nextT += E; this.step++;
    }
  }
};

/* ======================= SOLVER / GERADOR ======================= */
let solveAborted = false;
function solve(start, wantPath, limit){
  let nodes = 0, aborted = false; limit = limit || 25000;
  const seen = new Set(), path = [];
  const key = t => t.map(x => x.join(',')).sort().join('|');
  const done = t => t.every(x => x.length === 0 || (x.length === CAP && x.every(c => c === x[0])));
  function dfs(t){
    if (done(t)) return true;
    const k = key(t);
    if (seen.has(k)) return false;
    seen.add(k);
    if (++nodes > limit){ aborted = true; return false; }
    const moves = [];
    for (let i = 0; i < t.length; i++){
      const a = t[i];
      if (!a.length) continue;
      const top = a[a.length - 1];
      let run = 0;
      for (let q = a.length - 1; q >= 0 && a[q] === top; q--) run++;
      const uniform = run === a.length;
      if (uniform && a.length === CAP) continue;
      for (let j = 0; j < t.length; j++){
        if (i === j) continue;
        const b = t[j];
        if (b.length >= CAP) continue;
        if (b.length === 0){ if (uniform) continue; moves.push([1, i, j]); }
        else if (b[b.length - 1] === top) moves.push([0, i, j]);
      }
    }
    moves.sort((x, y) => x[0] - y[0]);
    for (const m of moves){
      const n = t.map(x => x.slice());
      const a = n[m[1]], b = n[m[2]];
      const top = a[a.length - 1];
      while (a.length && a[a.length - 1] === top && b.length < CAP) b.push(a.pop());
      path.push([m[1], m[2]]);
      if (dfs(n)) return true;
      path.pop();
      if (aborted) return false;
    }
    return false;
  }
  const r = dfs(start); solveAborted = aborted;
  if (wantPath) return r ? path : null;
  return r ? true : (aborted ? null : false);
}
function genLevel(level){
  const nColors = Math.min(10, 3 + Math.floor(level / 1.5));
  const empties = 2 + save.up.extra;
  let unknown = null, last = null;
  for (let a = 0; a < 14; a++){
    const ids = shuffle([...PALETTE.keys()]).slice(0, nColors);
    const pool = [];
    ids.forEach(id => { for (let i = 0; i < CAP; i++) pool.push(id); });
    shuffle(pool);
    const t = [];
    for (let i = 0; i < nColors; i++) t.push(pool.slice(i * CAP, (i + 1) * CAP));
    for (let i = 0; i < empties; i++) t.push([]);
    last = t;
    if (t.some(x => x.length === CAP && x.every(c => c === x[0]))) continue;
    const r = solve(t);
    if (r === true) return t;
    if (r === null) unknown = t;
  }
  return unknown || last;
}

function placeUI(){

  Object.keys(C).forEach(n => {
    const c = C[n], b = $('#' + n + 'Btn'); put(b, c[0], c[1], c[2], c[3], true);

  {id:'extra', name:'Reserva', desc:'+1 frasco vazio por fase', max:1, cost:l => [1500][l]},
  {id:'undo', name:'Voltar', desc:'+3 usos', consumable:true, cost:() => 90, have:() => save.undo, give:() => { save.undo += 3; }},
  {id:'hint', name:'Dica', desc:'+3 usos', consumable:true, cost:() => 120, have:() => save.hint, give:() => { save.hint += 3; }},
  {id:'tube', name:'Frasco', desc:'+2 usos', consumable:true, cost:() => 220, have:() => save.tubes, give:() => { save.tubes += 2; }}
];

/* ======================= TELAS (DOM) ======================= */
const layer = $('#layer');
function showLayer(html, cls){ stage.classList.toggle('sub', (cls || 'dim') !== 'menuL'); layer.className = 'layer on ' + (cls || 'dim'); layer.innerHTML = html; uiOpen = true; }
function hideLayer(){ stage.classList.remove('sub'); layer.className = 'layer'; layer.innerHTML = ''; uiOpen = false; }
const onOff = v => v ? 'Ligado' : 'Desligado';

function showMenu(){
  stage.classList.add('inmenu'); inMenu = true; selected = -1;
  showLayer(
    '<div class="logo"><div class="l1">' + GAME_NAME + '</div><div class="l2">' + GAME_SUB + '</div></div>' +
    '<div><div class="mbtns">' +
      '<button class="wbtn gold" data-act="play">Jogar &middot; Fase ' + save.level + '</button>' +
      '<button class="wbtn" data-act="shop" data-arg="menu">Lojinha</button>' +
      '<button class="wbtn" data-act="options" data-arg="menu">Opções</button>' +
      '<button class="wbtn" data-act="how" data-arg="menu">Como jogar</button>' +
    '</div><div class="foot">&#9733; ' + save.coins + ' moedas guardadas</div></div>', 'menuL');
}
function showPause(){
  showLayer('<div class="parch"><h2>Pausa</h2><div class="stack">' +
    '<button class="wbtn gold" data-act="resume">Continuar</button>' +
    '<button class="wbtn" data-act="restart">Reiniciar fase</button>' +
    '<button class="wbtn" data-act="options" data-arg="pause">Opções</button>' +
    '<button class="wbtn danger" data-act="menu">Menu principal</button></div></div>');
}
function showOptions(from){
  showLayer('<div class="parch"><h2>Opções</h2>' +
    '<div class="sw"><div><b>Música</b><span class="d">Trilha da taverna</span></div><button class="wbtn ' + (save.opt.music ? 'gold' : '') + '" data-act="tog" data-arg="music|' + from + '">' + onOff(save.opt.music) + '</button></div>' +
    '<div class="sw"><div><b>Som</b><span class="d">Efeitos sonoros</span></div><button class="wbtn ' + (save.opt.sound ? 'gold' : '') + '" data-act="tog" data-arg="sound|' + from + '">' + onOff(save.opt.sound) + '</button></div>' +
    '<div class="sw"><div><b>Apagar progresso</b><span class="d">Fase, moedas e melhorias</span></div><button class="wbtn danger" data-act="reset" data-arg="' + from + '">Apagar</button></div>' +
    '<div class="row"><button class="wbtn" data-act="back" data-arg="' + from + '">Voltar</button></div></div>');
}
function showHow(from){
  showLayer('<div class="parch"><h2>Como jogar</h2><ol class="steps">' +
    '<li>Toque num pote e depois em outro para despejar a ração.</li>' +
    '<li>Só dá para despejar em pote vazio ou com a mesma cor por cima.</li>' +
    '<li>Pote com 4 camadas da mesma cor vai para o caldeirão e rende moedas.</li>' +
    '<li>Travou? Use <b>Voltar</b> (desfaz 1 jogada), <b>Dica</b> (mostra uma jogada) ou <b>Frasco</b> (um frasco vazio extra).</li>' +
    '<li>Ao terminar, o pug bruxo vende ração a um cliente. Quanto menos jogadas, mais moedas! Gaste na lojinha.</li></ol>' +
    '<div class="row"><button class="wbtn" data-act="back" data-arg="' + from + '">Voltar</button></div></div>');
}
function showShop(from){
  const card = it => {
    const lvl = it.consumable ? 0 : save.up[it.id], maxed = !it.consumable && lvl >= it.max, cost = maxed ? 0 : it.cost(lvl), poor = !maxed && save.coins < cost;
    const status = it.consumable ? '<span class="have">x' + it.have() + '</span>' : '<span class="pips">' + Array.from({length: it.max}, (_, k) => '<i class="' + (k < lvl ? 'on' : '') + '"></i>').join('') + '</span>';
    return '<button class="scard' + (maxed ? ' max' : poor ? ' poor' : '') + '" data-act="buy" data-arg="' + it.id + '|' + from + '"><span class="sico">' + SHOP_ICO[it.id] + '</span>' +
      '<b>' + it.name + '</b><span class="sd">' + it.desc + '</span>' + status +
      '<span class="price">' + (maxed ? 'Máximo' : '<span class="coin"></span>' + cost) + '</span></button>';
  };
  let h = '<div class="parch shop"><h2>Lojinha</h2><div class="wallet"><span class="coin"></span>' + save.coins + '</div>' +
    '<div class="sec">Melhorias</div><div class="sgrid">' + SHOP.filter(i => !i.consumable).map(card).join('') + '</div>' +
    '<div class="sec">Ajudas</div><div class="sgrid">' + SHOP.filter(i => i.consumable).map(card).join('') + '</div>' +
    '<div class="row"><button class="wbtn" data-act="back" data-arg="' + from + '">Voltar</button></div></div>';
  showLayer(h);
}
function showClear(){
  showLayer('<div class="parch"><div class="stars">' + '&#9733;'.repeat(saleInfo.stars) + '<span style="opacity:.25">' + '&#9733;'.repeat(3 - saleInfo.stars) + '</span></div><h2>Fase concluída!</h2>' +
    '<p>' + (PUG() ? 'Ração vendida' : 'Poção vendida') + ' por <b>+' + lastSale + '</b> moedas' + (saleInfo.lucky ? ' (sorte em dobro!)' : '') + '.<br>Jogadas: <b>' + saleInfo.moves + '</b> &middot; Ideal: <b>' + saleInfo.par + '</b><br><span class="d">Menos jogadas = mais moedas</span></p>' +
    '<div class="row"><button class="wbtn" data-act="menu">Menu</button><button class="wbtn" data-act="shop" data-arg="clear">Lojinha</button><button class="wbtn gold" data-act="next">Próxima fase</button></div></div>');
}
function levelClear(){
  cleared = true; save.level++; persist(); updateHud();
  const g = cauldronGeo(); sparks(g.mouthX, g.mouthY, '#f3c85a', 40, 110); Snd.win();
  say.txt = PUG() ? 'Hora de vender, au!' : 'Hora de vender!'; say.t = 2;
  startSale();
}
function goBack(from){
  if (from === 'menu') showMenu(); else if (from === 'pause') showPause(); else if (from === 'clear') showClear(); else hideLayer();
}
function act(a, arg){
  const parts2 = (arg || '').split('|');
  switch (a){
    case 'play': hideLayer(); stage.classList.remove('inmenu'); inMenu = false; if (cleared && !sale) startLevel(); break;
    case 'resume': hideLayer(); break;
    case 'restart': hideLayer(); restartLevel(); break;
    case 'menu': showMenu(); break;
    case 'options': showOptions(arg); break;
    case 'how': showHow(arg); break;
    case 'shop': showShop(arg); break;
    case 'back': goBack(arg); break;
    case 'next': hideLayer(); startLevel(); break;
    case 'theme': save.opt.theme = PUG() ? 'witch' : 'pug'; persist(); Snd.init(); Snd.sel(); buildLayers(); showOptions(arg); break;
    case 'tog': save.opt[parts2[0]] = !save.opt[parts2[0]]; persist(); Snd.init(); Snd.music(save.opt.music); showOptions(parts2[1]); break;
    case 'buy': {
      const it = SHOP.find(s => s.id === parts2[0]);
      const lvl = it.consumable ? 0 : save.up[it.id];
      if (!it.consumable && lvl >= it.max) break;
      const cost = it.cost(lvl);
      if (save.coins < cost){ toast('Moedas insuficientes.'); break; }
      save.coins -= cost; if (it.consumable) it.give(); else save.up[it.id]++;
      persist(); updateHud(); showShop(parts2[1]); Snd.coin(); break;
    }
    case 'reset':
      showLayer('<div class="parch"><h2>Apagar tudo?</h2><p>Fase, moedas e melhorias voltam ao começo. Isso não pode ser desfeito.</p>' +
        '<div class="row"><button class="wbtn" data-act="back" data-arg="' + arg + '">Cancelar</button><button class="wbtn danger" data-act="resetyes">Apagar</button></div></div>');
      break;
    case 'resetyes':
      save = {coins:0, level:1, undo:3, hint:3, tubes:2, up:{cauldron:0, luck:0, extra:0}, opt:save.opt}; persist(); startLevel(); showMenu(); break;
  }
}
layer.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  Snd.init(); if (b.dataset.act !== 'buy') Snd.sel();
  act(b.dataset.act, b.dataset.arg);
});
$('#menuBtn').onclick = () => { Snd.init(); if (!busy) showPause(); };
$('#undoBtn').onclick = () => { Snd.init(); undo(); };
$('#hintBtn').onclick = () => { Snd.init(); useHint(); };
$('#tubeBtn').onclick = () => { Snd.init(); useTube(); };
$('#plusBtn').onclick = () => { Snd.init(); toast('A lojinha abre no menu e entre as fases.'); };

cv.addEventListener('pointerdown', e => {
  Snd.init();
  const r = cv.getBoundingClientRect();
  onTap((e.clientX - r.left) / sc, (e.clientY - r.top) / sc);
});

/* ======================= LOOP ======================= */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
startLevel();
showMenu();
requestAnimationFrame(frame);
try { if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('17px "MedievalSharp"'), document.fonts.load('800 12px "Cinzel"')]).then(buildLayers).catch(() => {}); } catch (e) {}
window.__snd = Snd; window.__brew = {get tubes(){ return tubes; }, setT(t){ tubes = t; lift = t.map(() => 0); layoutBoard(); }, act, startLevel, onTap, useHint, useTube, get pos(){ return pos; }, dbgSale(t, st){ cleared = true; startSale(); sale.type = t; sale.t0 = TT - st; }, get state(){ return {busy, cleared, pendingFlights, sentPotions, totalPotions, save}; }};
})();
</script>
</body>
</html>
