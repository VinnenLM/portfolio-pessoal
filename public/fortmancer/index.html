<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150f22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fortmancer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div id="hud" class="hidden">
    <div class="hud-l">
      <div class="bar hp"><i id="hpFill"></i><b id="hpTxt"></b><span class="ico"><i class="ph" data-ic="heart"></i></span></div>
      <div class="bar sh" id="shBar"><i id="shFill"></i></div>
    </div>
    <div class="hud-c">
      <div id="waveTxt"></div>
      <div class="bar wave"><i id="waveFill"></i></div>
      <div id="bossBar" class="hidden"><span id="bossName"></span><div class="bar boss"><i id="bossFill"></i></div></div>
    </div>
    <div class="hud-r">
      <div id="goldTxt" class="chip"><i class="ph" data-ic="coin"></i><b>0</b></div>
      <button id="btnSpeed" class="rbtn" data-a="speed">x1</button>
      <button id="btnPause" class="rbtn" data-a="pause"><i class="ph" data-ic="pause"></i></button>
    </div>
  </div>

  <div id="skills" class="hidden"></div>
  <div id="toast"></div>
  <div id="ui"></div>
  <div id="modal" class="hidden"></div>
</div>
<div id="rotate"><div><img class="pi" id="rotImg" alt=""><p>Gire o celular para a horizontal</p></div></div>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script>document.getElementById("rotImg").src = Art.iconURL("retry");</script>
</body>
</html>
